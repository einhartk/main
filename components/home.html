<div>
  <div v-if="searchResults.length===0">
    <!-- YouTube Video Section -->
    <div class="youtube-container mb-4">
      <h2>오늘의 영상</h2>
      <div class="ratio ratio-16x9">
        <iframe 
          src="https://www.youtube.com/embed/5rLcF8tkZVE?autoplay=0&controls=1&rel=0" 
          title="로르륵위키 소개 영상" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>
    </div>
    
    <h2>대문 소개</h2>
    <p>🧭 로르륵위키에 오신 것을 환영합니다! 이 위키는 문서를 등록, 수정, 검색 가능합니다.</p>
  </div>
  <ul class="list-group" v-else>
    <li v-for="doc in searchResults" @click="$props.onView(doc)" class="list-group-item list-group-item-action">
      {{ doc.title }} - {{ doc.dateStr }}
    </li>
  </ul>
</div>
