        showCancelButton: true,
        confirmButtonText: '확인',

        confirmButtonColor: '#5c3ccf',
        cancelButtonColor: '#aaa',
        background: '#fefefe',
        customClass: {
          popup: 'cy-modal'
        }
      });
    };
    
    function updateActiveTab(tabId) {
      const tabs = document.querySelectorAll('.menu-button button[id^="tab-"]');
      tabs.forEach(tab => tab.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
    }
    
    // 방문자 카운트 관리 (Firebase)
    async function updateVisitorCount() {
      if (!window.db) {
        console.log('Firebase not ready for visitor count');
        return;
      }
      
      // 사용자 ID 생성/확인
      let userId = localStorage.getItem('visitorUserId');
      if (!userId) {
        userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('visitorUserId', userId);
      }
      
      const today = new Date().toDateString();
      const db = window.db;
      
      try {
        // 카운터 문서 참조
        const counterRef = db.collection('cy-visitors').doc('counter');
        const userRef = db.collection('cy-visitors').doc(userId);
        
        // 사용자 방문 기록 확인
        const userDoc = await userRef.get();
        const userData = userDoc.exists ? userDoc.data() : {};
        const lastVisit = userData.lastVisitDate;
        
        // 오늘 첫 방문인 경우에만 카운트 증가
        if (lastVisit !== today) {
          await db.runTransaction(async (transaction) => {
            const counterDoc = await transaction.get(counterRef);
            let counterData = counterDoc.exists ? counterDoc.data() : { total: 0, today: 0, lastUpdated: today };
            
            // 날짜가 바뀌면 today 리셋
            if (counterData.lastUpdated !== today) {
              counterData.today = 0;
              counterData.lastUpdated = today;
            }
            
            // 카운트 증가
            counterData.total++;
            counterData.today++;
            
            transaction.set(counterRef, counterData);
            transaction.set(userRef, { 
              lastVisitDate: today, 
              visitCount: (userData.visitCount || 0) + 1,
              firstVisit: userData.firstVisit || new Date().toISOString()
            });
          });
        }
        
        // 화면에 표시
        const counterDoc = await counterRef.get();
        const counterData = counterDoc.exists ? counterDoc.data() : { total: 1, today: 1 };
        document.getElementById('todayVisitors').textContent = counterData.today || 1;
        document.getElementById('totalVisitors').textContent = counterData.total || 1;
        
      } catch (error) {
        console.error('Visitor count error:', error);
        document.getElementById('todayVisitors').textContent = '?';
        document.getElementById('totalVisitors').textContent = '?';
      }
    }
    
    // 초기 로드 시 실행 (비동기로 분리)
    document.addEventListener('DOMContentLoaded', function() {
      updateActiveTab('tab-home');
      // 방문자 카운팅은 메인 렌더링 후 실행
      if ('requestIdleCallback' in window) {
        requestIdleCallback(() => updateVisitorCount(), { timeout: 2000 });
      } else {
        setTimeout(updateVisitorCount, 100);
      }
    });

            <script>
              // Apply background (read-only from room.html saved data)
              function applyMiniroomBg(bg) {
                const display = document.getElementById('miniroom-display');
                if (!display) return; // Safety check for SPA loading
                
                display.style.backgroundImage = '';
                display.style.backgroundColor = '';
                
                switch(bg) {
                  case 'grid':
                    display.style.background = '#f5f5f5';
                    display.style.backgroundImage = 'linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px)';
                    display.style.backgroundSize = '20px 20px';
                    break;
                  case 'room':
                    display.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                    break;
                  case 'sky':
                    display.style.background = 'linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%)';
                    break;
                  case 'grass':
                    display.style.background = 'linear-gradient(to bottom, #87CEEB 0%, #90EE90 60%, #228B22 100%)';
                    break;
                  case 'pink':
                    display.style.background = 'linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%)';
                    break;
                  case 'mini':
                    display.style.background = 'url(image/mini.PNG)';
                    display.style.backgroundSize = '100% 100%';
                    display.style.backgroundPosition = 'center center';
                    display.style.backgroundRepeat = 'no-repeat';
                    break;
                }
              }
              
              // Load saved room data from room.html
              function loadMiniroomData() {
                const savedData = localStorage.getItem('roomDecoration');
                const savedBg = localStorage.getItem('roomBackground') || 'grid';
                const display = document.getElementById('miniroom-display');
                const placeholder = document.getElementById('miniroom-placeholder');
                
                if (!display) return; // Safety check for SPA loading
                
                // Apply saved background
                applyMiniroomBg(savedBg);
                
                // Clear existing items first
                display.querySelectorAll('img').forEach(el => el.remove());
                if (placeholder) placeholder.style.display = 'block';
                
                // Load saved items if exists
                if (savedData) {
                  try {
                    const data = JSON.parse(savedData);
                    const items = data.items || data; // Support both formats
                    
                    if (items && items.length > 0) {
                      if (placeholder) placeholder.style.display = 'none';
                      
                      items.forEach(item => {
                        const el = document.createElement('img');
                        el.src = item.src;
                        // Use percentage for responsive positioning (same as room.html)
                        const left = item.left || '10%';
                        const top = item.top || '10%';
                        const width = item.width || '15%';
                        el.style.cssText = `position:absolute;left:${left};top:${top};width:${width};z-index:1`;
                        el.style.transform = `rotate(${item.rotate || 0}deg) scale(${item.scale || 1})`;
                        el.style.maxWidth = '100px';
                        el.style.maxHeight = '100px';
                        el.style.opacity = '0.9';
                        display.appendChild(el);
                      });
                    }
                  } catch (e) {
                    console.error('Failed to load room data:', e);
                  }
                }
              }
              
              // Load when page loads
              document.addEventListener('DOMContentLoaded', loadMiniroomData);
            </script>

<script>
// 홈 화면 실시간 카운트 업데이트
function updateHomeCounts() {
  if (!window.db) {
    console.log('Firebase not ready yet');
    return;
  }
  
  // 오늘 날짜 범위 계산
  const now = new Date();
  const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const endOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  
  // 다이어리 카운트 리스너
  window.db.collection('cy-diary').onSnapshot((snapshot) => {
    const total = snapshot.size;
    let today = 0;
    
    snapshot.forEach((doc) => {
      const data = doc.data();
      if (data.timestamp && data.timestamp.toDate) {
        const entryDate = data.timestamp.toDate();
        if (entryDate >= startOfDay && entryDate < endOfDay) {
          today++;
        }
      }
    });
    
    const todayEl = document.getElementById('diaryTodayCount');
    const totalEl = document.getElementById('diaryTotalCount');
    if (todayEl) todayEl.textContent = today;
    if (totalEl) totalEl.textContent = total;
  });
  
  // 사진첩 카운트 리스너
  window.db.collection('cy-album').onSnapshot((snapshot) => {
    const total = snapshot.size;
    let today = 0;
    
    snapshot.forEach((doc) => {
      const data = doc.data();
      if (data.timestamp && data.timestamp.toDate) {
        const entryDate = data.timestamp.toDate();
        if (entryDate >= startOfDay && entryDate < endOfDay) {
          today++;
        }
      }
    });
    
    const todayEl = document.getElementById('albumTodayCount');
    const totalEl = document.getElementById('albumTotalCount');
    if (todayEl) todayEl.textContent = today;
    if (totalEl) totalEl.textContent = total;
  });
}

// Firebase 준비되면 카운트 업데이트 시작
document.addEventListener('firebaseReady', updateHomeCounts);

// DOM 로드 후 Firebase가 이미 준비되어 있으면 바로 실행
document.addEventListener('DOMContentLoaded', function() {
  if (window.firebaseInitialized && window.db) {
    updateHomeCounts();
  }
});
</script>

</body>

</html>
