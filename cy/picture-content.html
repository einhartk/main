<script>
// Album Firebase Integration
let albumRef = null;
let editingAlbumId = null;
let pendingImageFile = null;

// Initialize Firebase Album
(function initAlbum() {
  if (window.firebaseInitialized && window.db) {
    setupAlbumListener();
  } else {
    document.addEventListener('firebaseReady', setupAlbumListener, { once: true });
  }
})();

function setupAlbumListener() {
  if (!window.db) return;
  
  albumRef = window.db.collection('cy-album').orderBy('timestamp', 'desc');
  
  albumRef.onSnapshot((snapshot) => {
    const albumList = document.getElementById('albumList');
    albumList.innerHTML = '';
    
    if (snapshot.empty) {
      albumList.innerHTML = '<div class="loading-overlay">작성된 앨범이 없습니다.</div>';
      localStorage.removeItem('selectedAlbumId');
      return;
    }
    
    snapshot.forEach((doc) => {
      const data = doc.data();
      const album = createAlbumElement(doc.id, data);
      albumList.appendChild(album);
    });
    
    // localStorage에서 선택된 앨범 ID 확인
    const selectedAlbumId = localStorage.getItem('selectedAlbumId');
    
    if (selectedAlbumId) {
      // 선택된 앨범으로 스크롤 및 하이라이트
      setTimeout(() => {
        const selectedEl = document.querySelector(`[data-id="${selectedAlbumId}"]`);
        if (selectedEl) {
          selectedEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          selectedEl.style.boxShadow = '0 0 10px #5c3ccf';
          setTimeout(() => {
            selectedEl.style.boxShadow = '';
          }, 2000);
        }
        // localStorage 클리어
        localStorage.removeItem('selectedAlbumId');
      }, 100);
    }
    
  }, (error) => {
    console.error('Album listener error:', error);
    document.getElementById('albumList').innerHTML = '<div class="loading-overlay" style="color: red;">앨범을 불러오는 중 오류가 발생했습니다.</div>';
  });
}

function createAlbumElement(id, data) {
  const div = document.createElement('div');
  div.className = 'album-item';
  div.dataset.id = id;
  
  const date = data.timestamp ? data.timestamp.toDate() : new Date();
  const dateStr = `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, '0')}.${String(date.getDate()).padStart(2, '0')}`;
  
  div.innerHTML = `
    <div class="album-header">
      <span class="album-title">${escapeHtml(data.title || '제목 없음')}</span>
      <span class="album-date">${dateStr}</span>
    </div>
    <div class="album-content">${data.content || ''}</div>
    <div class="album-actions">
      <button class="edit-btn" onclick="editAlbum('${id}', '${escapeHtml(data.title || '')}')">수정</button>
      <button class="delete-btn" onclick="deleteAlbum('${id}')">삭제</button>
    </div>
  `;
  
  return div;
}

function escapeHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Editor Functions
function showAlbumForm() {
  document.getElementById('editorForm').style.display = 'block';
  document.getElementById('newAlbumBtn').style.display = 'none';
  editingAlbumId = null;
  document.getElementById('albumTitle').value = '';
  document.getElementById('albumEditor').innerHTML = '';
  pendingImageFile = null;
}

function cancelAlbumEdit() {
  document.getElementById('editorForm').style.display = 'none';
  document.getElementById('newAlbumBtn').style.display = 'inline-block';
  editingAlbumId = null;
  document.getElementById('albumTitle').value = '';
  document.getElementById('albumEditor').innerHTML = '';
  pendingImageFile = null;
}

function formatText(command) {
  document.execCommand(command, false, null);
  document.getElementById('albumEditor').focus();
}

function insertImage() {
  document.getElementById('editorImageUpload').click();
}

// Handle image upload to editor (Base64 for Firestore)
document.getElementById('editorImageUpload').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  
  if (!window.db) {
    alert('Firebase가 초기화되지 않았습니다.');
    return;
  }
  
  // Check file size (Firestore has 1MB limit, keep it under 500KB for safety)
  if (file.size > 500 * 1024) {
    window.showModal('알림', '파일 크기가 너무 큽니다. 500KB 이하의 이미지를 선택해주세요.', 'warning');
    e.target.value = '';
    return;
  }
  
  // Show uploading indicator in editor
  const editor = document.getElementById('albumEditor');
  const placeholder = document.createElement('div');
  placeholder.className = 'upload-progress';
  placeholder.textContent = '사진 변환 중...';
  editor.appendChild(placeholder);
  
  // Read file as Base64
  const reader = new FileReader();
  reader.onload = function(event) {
    const base64Image = event.target.result;
    
    // Remove placeholder and insert image
    placeholder.remove();
    
    const img = document.createElement('img');
    img.src = base64Image; // Store as Base64 data URL
    img.style.maxWidth = '100%';
    img.style.borderRadius = '8px';
    img.style.margin = '10px 0';
    img.dataset.base64 = 'true'; // Mark as base64 image
    editor.appendChild(img);
    
    // Add a line break after image
    const br = document.createElement('br');
    editor.appendChild(br);
  };
  
  reader.onerror = function() {
    placeholder.textContent = '파일 읽기 실패';
    setTimeout(() => placeholder.remove(), 3000);
  };
  
  reader.readAsDataURL(file);
  
  // Reset input
  e.target.value = '';
});

async function saveAlbum() {
  if (!window.db) {
    alert('Firebase가 초기화되지 않았습니다.');
    return;
  }
  
  const title = document.getElementById('albumTitle').value.trim();
  const content = document.getElementById('albumEditor').innerHTML;
  const saveBtn = document.querySelector('.editor-actions .save-btn');
  
  if (!title) {
    window.showModal('알림', '제목을 입력해주세요.', 'warning');
    return;
  }
  
  // Show loading overlay
  const loadingOverlay = document.getElementById('albumLoadingOverlay');
  if (loadingOverlay) {
    loadingOverlay.style.display = 'flex';
    document.body.style.overflow = 'hidden';
  }
  
  // Show loading on button
  if (saveBtn) {
    saveBtn.disabled = true;
    saveBtn.textContent = '저장 중...';
  }
  
  const albumData = {
    title: title,
    content: content,
    timestamp: firebase.firestore.FieldValue.serverTimestamp()
  };
  
  function resetButton() {
    if (saveBtn) {
      saveBtn.disabled = false;
      saveBtn.textContent = '저장';
    }
    if (loadingOverlay) {
      loadingOverlay.style.display = 'none';
      document.body.style.overflow = 'auto';
    }
  }
  
  try {
    if (editingAlbumId) {
      await window.db.collection('cy-album').doc(editingAlbumId).update(albumData);
      window.showModal('성공', '수정 완료!', 'success');
    } else {
      await window.db.collection('cy-album').add(albumData);
      window.showModal('성공', '저장 완료!', 'success');
    }
    resetButton();
    cancelAlbumEdit();
  } catch (error) {
    console.error('Error saving album:', error);
    resetButton();
    window.showModal('오류', '저장 중 오류가 발생했습니다.', 'error');
  }
}

function editAlbum(id, title) {
  editingAlbumId = id;
  const albumElement = document.querySelector(`.album-item[data-id="${id}"]`);
  const content = albumElement.querySelector('.album-content').innerHTML;
  
  document.getElementById('editorForm').style.display = 'block';
  document.getElementById('newAlbumBtn').style.display = 'none';
  document.getElementById('albumTitle').value = title;
  document.getElementById('albumEditor').innerHTML = content;
}

async function deleteAlbum(id) {
  const result = await window.showConfirm('확인', '정말로 이 앨범을 삭제하시겠습니까?', 'warning');
  if (!result.isConfirmed) return;
  if (!window.db) return;
  
  try {
    await window.db.collection('cy-album').doc(id).delete();
    console.log('Album deleted successfully');
  } catch (error) {
    console.error('Error deleting album:', error);
    window.showModal('오류', '삭제 중 오류가 발생했습니다.', 'error');
  }
}

// Image modal view (existing functionality)
document.addEventListener('click', function(e) {
  if (e.target.tagName === 'IMG' && e.target.closest('.album-content')) {
    const imgSrc = e.target.src;
    const modal = document.createElement('div');
    modal.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      cursor: pointer;
    `;
    
    const img = document.createElement('img');
    img.src = imgSrc;
    img.style.maxWidth = '90%';
    img.style.maxHeight = '90%';
    img.style.borderRadius = '8px';
    
    modal.appendChild(img);
    document.body.appendChild(modal);
    
    modal.addEventListener('click', function() {
      document.body.removeChild(modal);
    });
  }
});
</script>
