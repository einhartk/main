<script>
// Room Decoration JavaScript
const room = document.getElementById('room');
const items = document.querySelectorAll('#item-palette .palette-item');
let selectedItem = null;
let selectedHandle = null;
let draggedItem = null;
let offsetX, offsetY;
let isDragging = false;
let isResizing = false;
let isRotating = false;
let startAngle = 0;
let startRotation = 0;
let currentMoveHandler = null;
let currentUpHandler = null;

// Global move handler for dragging items
function moveHandler(eMove) {
  if (!draggedItem) return;
  draggedItem.style.left = eMove.pageX - room.getBoundingClientRect().left - draggedItem.width/2 + 'px';
  draggedItem.style.top = eMove.pageY - room.getBoundingClientRect().top - draggedItem.height/2 + 'px';
}

// Global up handler for dropping items
function upHandler(e) {
  e.preventDefault();
  if (currentMoveHandler) {
    document.removeEventListener('mousemove', currentMoveHandler);
    document.removeEventListener('mouseup', currentUpHandler);
    currentMoveHandler = null;
    currentUpHandler = null;
  }
  if (draggedItem) {
    // Add event listeners for the newly placed item
    draggedItem.addEventListener('mousedown', itemMouseDown);
    draggedItem = null;
  }
}

// 팔레트에서 방으로 드래그
items.forEach(item => {
  item.addEventListener('mousedown', e => {
    // Create a deep clone of the item and set initial styles
    const clone = item.cloneNode(true);
    clone.classList.remove('palette-item');
    clone.classList.add('room-item');
    clone.style.position = 'absolute';
    clone.style.left = (e.pageX - room.getBoundingClientRect().left - 25) + 'px';
    clone.style.top = (e.pageY - room.getBoundingClientRect().top - 25) + 'px';
    clone.style.width = '80px';
    clone.style.height = 'auto';
    clone.style.maxWidth = '150px';
    clone.style.maxHeight = '150px';
    clone.style.transform = 'rotate(0deg)';
    clone.style.zIndex = '1';
    
    // Set the dragged item
    draggedItem = clone;
    
    // Add the new item to the room
    room.appendChild(clone);
    
    // Select the new item
    selectItem(clone);
    
    // Add the item to the event listeners
    addItemEventListeners();

    // Set up the move and up handlers
    currentMoveHandler = moveHandler;
    currentUpHandler = upHandler;
    
    document.addEventListener('mousemove', currentMoveHandler);
    document.addEventListener('mouseup', currentUpHandler);
  });
});

// 방 안 아이템 선택/이동
room.addEventListener('mousedown', e => {
  const handle = e.target.closest('.resize-handle, .rotate-handle');
  const item = e.target.closest('.room-item');
  
  if (handle) {
    e.stopPropagation();
    selectedHandle = handle.className;
    
    if (handle.classList.contains('resize-handle')) {
      isResizing = true;
    } else if (handle.classList.contains('rotate-handle')) {
      isRotating = true;
      const rect = selectedItem.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      startAngle = Math.atan2(e.clientY - centerY, e.clientX - centerX) * 180 / Math.PI;
      startRotation = parseFloat(selectedItem.getAttribute('data-rotate') || '0');
    }
    return;
  }
  
  if (item) {
    selectItem(item);
    const rect = item.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    isDragging = true;
  } else {
    deselectItem();
  }
});

document.addEventListener('mousemove', e => {
  if (!selectedItem) return;
  
  const roomRect = room.getBoundingClientRect();
  
  if (isResizing && selectedHandle === 'resize-handle') {
    // Resize logic
    const width = e.clientX - parseFloat(selectedItem.style.left) - roomRect.left;
    const height = e.clientY - parseFloat(selectedItem.style.top) - roomRect.top;
    
    if (width > 30) selectedItem.style.width = width + 'px';
    if (height > 30) selectedItem.style.height = height + 'px';
    
  } else if (isRotating && selectedHandle === 'rotate-handle') {
    // Rotation logic
    const rect = selectedItem.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const angle = Math.atan2(e.clientY - centerY, e.clientX - centerX) * 180 / Math.PI;
    const rotation = startRotation + angle - startAngle;
    
    selectedItem.style.transform = `rotate(${rotation}deg)`;
    selectedItem.setAttribute('data-rotate', rotation);
    
  } else if (isDragging) {
    // Dragging logic
    const left = e.clientX - offsetX - roomRect.left;
    const top = e.clientY - offsetY - roomRect.top;
    
    // Keep item within room bounds
    if (left >= 0 && left + selectedItem.offsetWidth <= roomRect.width) {
      selectedItem.style.left = left + 'px';
    }
    if (top >= 0 && top + selectedItem.offsetHeight <= roomRect.height) {
      selectedItem.style.top = top + 'px';
    }
  }
});

// 선택 아이템 표시
function selectItem(item) {
  deselectItem();
  selectedItem = item;
  item.classList.add('selected');
  
  // Add resize handle if not exists
  if (!item.querySelector('.resize-handle')) {
    const resizeHandle = document.createElement('div');
    resizeHandle.className = 'resize-handle';
    item.appendChild(resizeHandle);
    
    // Add rotate handle if not exists
    const rotateHandle = document.createElement('div');
    rotateHandle.className = 'rotate-handle';
    item.appendChild(rotateHandle);
  }
}

function deselectItem() {
  if (selectedItem) {
    selectedItem.classList.remove('selected');
    // Remove all handles when deselecting
    const handles = selectedItem.querySelectorAll('.resize-handle, .rotate-handle');
    handles.forEach(handle => handle.remove());
  }
  selectedItem = null;
  selectedHandle = null;
}

// 키 이벤트: 삭제, 회전, 크기 조절
// 아이템 마우스 다운 핸들러
function itemMouseDown(e) {
  e.stopPropagation();
  const item = e.target.closest('.room-item');
  if (item) {
    selectItem(item);
    const rect = item.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    isDragging = true;
  }
}

// 모든 아이템에 이벤트 리스너 추가
function addItemEventListeners() {
  document.querySelectorAll('.room-item').forEach(item => {
    // Remove existing listeners to prevent duplicates
    item.removeEventListener('mousedown', itemMouseDown);
    item.addEventListener('mousedown', itemMouseDown);
  });
}

// 초기 아이템에 이벤트 리스너 추가
addItemEventListeners();

// Z-Index 조절 이벤트 리스너 추가
document.getElementById('zIndexUp').addEventListener('click', () => {
  if (selectedItem) {
    const currentZ = parseInt(selectedItem.style.zIndex) || 1;
    selectedItem.style.zIndex = currentZ + 1;
  }
});

document.getElementById('zIndexDown').addEventListener('click', () => {
  if (selectedItem) {
    const currentZ = parseInt(selectedItem.style.zIndex) || 1;
    selectedItem.style.zIndex = Math.max(0, currentZ - 1);
  }
});

document.addEventListener('keydown', e => {
  // Z-Index 조절 (P: 앞으로, O: 뒤로)
  if (e.key.toLowerCase() === 'p' && selectedItem) {
    e.preventDefault();
    const currentZ = parseInt(selectedItem.style.zIndex) || 1;
    selectedItem.style.zIndex = currentZ + 1;
    return;
  } else if (e.key.toLowerCase() === 'o' && selectedItem) {
    e.preventDefault();
    const currentZ = parseInt(selectedItem.style.zIndex) || 1;
    selectedItem.style.zIndex = Math.max(0, currentZ - 1);
    return;
  }
  
  // Space or Enter 키로 아이템 배치 완료
  if ((e.key === ' ' || e.key === 'Enter') && draggedItem) {
    e.preventDefault();
    if (currentMoveHandler) {
      document.removeEventListener('mousemove', currentMoveHandler);
      document.removeEventListener('mouseup', currentUpHandler);
      currentMoveHandler = null;
      currentUpHandler = null;
    }
    draggedItem = null;
    return;
  }
  
  // ESC 키로 선택 취소
  if (e.key === 'Escape') {
    deselectItem();
    return;
  }
  
  if(!selectedItem) return;
  
  // Delete item
  if(e.key === 'Delete') {
    if (confirm('정말 이 아이템을 삭제하시겠습니까?')) {
      selectedItem.remove();
      selectedItem = null;
    }
  }
  
  // 크기 조절
  if(e.key === '+' || e.key === '=') {
    const scale = parseFloat(selectedItem.getAttribute('data-scale') || '1');
    const newScale = Math.min(scale + 0.1, 3); // 최대 3배까지
    const rotation = selectedItem.getAttribute('data-rotate') || '0';
    selectedItem.style.transform = `rotate(${rotation}deg) scale(${newScale})`;
    selectedItem.setAttribute('data-scale', newScale);
  }
  
  if(e.key === '-' || e.key === '_') {
    const scale = parseFloat(selectedItem.getAttribute('data-scale') || '1');
    const newScale = Math.max(scale - 0.1, 0.5); // 최소 0.5배까지
    const rotation = selectedItem.getAttribute('data-rotate') || '0';
    selectedItem.style.transform = `rotate(${rotation}deg) scale(${newScale})`;
    selectedItem.setAttribute('data-scale', newScale);
  }
  
  // 화살표 키로 회전 (Shift 키와 함께 누르면 45도씩 회전)
  if(e.key === 'ArrowRight') {
    const currentRotation = parseFloat(selectedItem.getAttribute('data-rotate') || '0');
    const newRotation = e.shiftKey ? currentRotation + 45 : currentRotation + 5;
    const scale = selectedItem.getAttribute('data-scale') || '1';
    selectedItem.style.transform = `rotate(${newRotation}deg) scale(${scale})`;
    selectedItem.setAttribute('data-rotate', newRotation);
  }
  
  if(e.key === 'ArrowLeft') {
    const currentRotation = parseFloat(selectedItem.getAttribute('data-rotate') || '0');
    const newRotation = e.shiftKey ? currentRotation - 45 : currentRotation - 5;
    const scale = selectedItem.getAttribute('data-scale') || '1';
    selectedItem.style.transform = `rotate(${newRotation}deg) scale(${scale})`;
    selectedItem.setAttribute('data-rotate', newRotation);
  }
});

// 저장
document.getElementById('saveBtn').addEventListener('click', () => {
  const state = Array.from(room.children)
    .filter(el => el.classList.contains('room-item'))
    .map(el => ({
      type: el.dataset.type,
      src: el.src,
      left: el.style.left,
      top: el.style.top,
      width: el.style.width,
      height: el.style.height,
      rotate: el.getAttribute('data-rotate') || '0',
      scale: el.getAttribute('data-scale') || '1'
    }));
  localStorage.setItem('roomState', JSON.stringify(state));
  alert('저장 완료!');
});

// 불러오기
document.getElementById('loadBtn').addEventListener('click', () => {
  room.innerHTML = '';
  const state = JSON.parse(localStorage.getItem('roomState') || '[]');
  state.forEach(item => {
    const el = document.createElement('img');
    el.src = item.src;
    el.dataset.type = item.type;
    el.className = 'room-item';
    el.style.position = 'absolute';
    el.style.left = item.left;
    el.style.top = item.top;
    el.style.width = item.width;
    el.style.height = item.height;
    el.setAttribute('data-rotate', item.rotate || '0');
    el.setAttribute('data-scale', item.scale || '1');
    el.style.transform = `rotate(${item.rotate || '0'}deg) scale(${item.scale || '1'})`;
    room.appendChild(el);
  });
  
  // Add event listeners to loaded items
  addItemEventListeners();
});

// 마우스 업 시 드래깅, 리사이징, 회전 종료
document.addEventListener('mouseup', () => {
  isDragging = false;
  isResizing = false;
  isRotating = false;
});
</script>
