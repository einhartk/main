<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>🧭 로르륵위키</title>
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">

  <!-- Bootstrap 5 CSS & JS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Vue -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="js/firebase-config.js"></script>

  <!-- Summernote -->
  <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.js"></script>

  <!-- 커스텀 CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- 로딩 오버레이 -->
  <div v-if="loading" id="loading-overlay" class="d-flex justify-content-center align-items-center">
    <div class="loader"></div>
  </div>

  <!-- 헤더 -->
  <header class="d-flex flex-wrap align-items-center shadow-sm bg-white fixed-top p-2">
    <h1 @click="goHome" class="me-3">🧭 로르륵위키</h1>
    <div class="d-flex align-items-center flex-wrap">
      <input v-model="searchQuery" placeholder="문서 검색..." class="form-control form-control-sm me-2" />
      <button @click="searchDocs" class="btn btn-sm btn-primary me-2">검색</button>
      <button @click="editDoc()" class="btn btn-sm btn-success">새 문서 작성</button>
    </div>
  </header>

  <!-- 플로팅 바 -->
  <div id="floating-bar">
    <div id="user-id-container">
      <input v-model="userIdInput" :disabled="!editUserId" placeholder="캐릭터 ID" class="form-control form-control-sm mb-1" style="width:120px;" />
      <button @click="toggleEditUserId" class="btn btn-sm btn-outline-secondary">{{ editUserId ? '저장' : '수정' }}</button>
    </div>
    <a :href="floatingLinks[0]" target="_blank"><img src="img/icon1.png" alt="icon1"/></a>
    <a :href="floatingLinks[1]" target="_blank"><img src="img/icon2.png" alt="icon2"/></a>
    <a :href="floatingLinks[2]" target="_blank"><img src="img/icon3.png" alt="icon3"/></a>
    <a :href="floatingLinks[3]" target="_blank"><img src="img/icon4.png" alt="icon4"/></a>
  </div>

  <!-- 메인 -->
  <main class="container-fluid mt-3">
    <sidebar-view v-if="!searchMode" :recent-docs="recentDocs" @view-doc="viewDoc"></sidebar-view>
    <section id="content">
      <component :is="currentView"
                 :doc="currentDoc"
                 :search-results="searchResults"
                 :on-view="viewDoc"
                 :on-edit="editDoc"
                 :on-save="saveDoc">
      </component>
    </section>
  </main>
</div>

<script src="js/app.js"></script>
</body>
</html>
