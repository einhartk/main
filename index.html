<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🧭 로르륵위키</title>
  <link rel="icon" href="img/favicon.ico" type="image/x-icon">

  <!-- Bootstrap 5 CSS & JS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <!-- Tesseract.js for OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
  <!-- html2canvas for screen capture -->
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <!-- Vue -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  
  <!-- App Scripts with cache busting -->
  <!-- Config files -->
  <script src="js/config/firebase-config.js?v=1.0.0"></script>
  <script src="js/config/categories.js?v=1.0.0"></script>
  <script src="js/config/api-config.js?v=1.0.0"></script>
  
  <!-- Services -->
  <script src="js/services/documentService.js?v=1.0.0"></script>
  <script src="js/services/screenCaptureService.js?v=1.0.0"></script>
  
  <!-- Components -->
  <script src="js/components/sidebar.js?v=1.0.0"></script>
  <script src="js/components/viewer.js?v=1.0.0"></script>
  <script src="js/components/editor.js?v=1.0.0"></script>
  <script src="js/components/homework.js?v=1.0.0"></script>
  
  <!-- Main App -->
  <script src="js/app.js?v=1.0.0"></script>
  <script>
    // Add timestamp to prevent caching for future loads
    const scripts = document.querySelectorAll('script[src*=".js"]');
    scripts.forEach(script => {
      if (script.src.includes('?')) return; // Skip already versioned scripts
      if (script.src.includes('http')) return; // Skip CDN scripts
      script.src = script.src + (script.src.includes('?') ? '&' : '?') + 'v=' + new Date().getTime();
    });
  </script>

  <!-- Summernote -->
  <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.js"></script>

  <!-- Marked.js for Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- Prism.js for syntax highlighting -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/themes/prism.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.24.1/components/prism-markdown.min.js"></script>

  <!-- Axios (for API calls) -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <!-- 커스텀 CSS -->
  <link rel="stylesheet" href="css/style.css?v=1.0.0">
  <!-- 컴포넌트별 CSS는 style.css에서 @import로 자동 로드됨 -->
  <!-- Version parameter is added to prevent caching issues -->
</head>
<body>
<div id="app">
  <!-- 로딩 오버레이 -->
  <div v-if="loading" id="loading-overlay" class="d-flex justify-content-center align-items-center">
    <div class="loader"></div>
  </div>

  <!-- 헤더 -->
  <header class="bg-white fixed-top">
    <div class="container-fluid">
      <div class="d-flex align-items-center">
        <h1 @click="goHome" class="me-3 flex-shrink-0">🧭 로르륵위키</h1>
        <div class="search-container me-2">
          <input v-model="searchQuery" 
                 @keyup.enter="searchDocs"
                 placeholder="문서 검색..." 
                 class="form-control form-control-sm" />
        </div>
        <div class="btn-group">
          <button @click="searchDocs" class="btn btn-sm btn-primary">
            <span class="d-none d-sm-inline">검색</span>
            <i class="bi bi-search d-sm-none"></i>
          </button>
          <button @click="editDoc()" class="btn btn-sm btn-success">
            <span class="d-none d-sm-inline">새 문서</span>
            <i class="bi bi-plus-lg d-sm-none"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- 플로팅 바 토글 버튼 (닫혔을 때만 보임) -->
  <button id="floating-bar-toggle" @click="toggleFloatingBar" :class="{ 'hidden': isFloatingBarVisible }" aria-label="메뉴 열기">
    <i class="bi bi-chevron-left"></i>
  </button>

  <!-- 플로팅 바 -->
  <div id="floating-bar" :class="{ 'hidden': !isFloatingBarVisible }">
    <button @click="toggleFloatingBar" class="floating-close-btn" aria-label="메뉴 닫기">
      <i class="bi bi-x-lg"></i>
    </button>
    <div id="user-id-container">
      <input v-model="tempUserId" :disabled="!editUserId" placeholder="캐릭터 ID" class="form-control form-control-sm mb-1" style="width:120px;" @keyup.enter="saveUserId" />
      <button @click="toggleEditUserId" class="btn btn-sm btn-outline-secondary">{{ editUserId ? '저장' : '수정' }}</button>
    </div>
    <a @click="openHomework" class="d-flex align-items-center text-decoration-none mt-2" style="cursor: pointer;">
      <img src="img/homework.png" alt="원정대 체크" class="me-1"/>
      <span class="text-dark">원정대 체크</span>
    </a>
    <a :href="floatingLinks[0]" target="_blank" class="d-flex align-items-center text-decoration-none">
      <img src="img/icon1.png" alt="icon1" class="me-1"/>
      <span class="text-dark">로펙</span>
    </a>
    <a :href="floatingLinks[1]" target="_blank" class="d-flex align-items-center text-decoration-none">
      <img src="img/icon2.png" alt="icon2" class="me-1"/>
      <span class="text-dark">로아와</span>
    </a>
    <a :href="floatingLinks[2]" target="_blank" class="d-flex align-items-center text-decoration-none">
      <img src="img/icon3.png" alt="icon3" class="me-1"/>
      <span class="text-dark">로아툴</span>
    </a>
    <a :href="floatingLinks[3]" target="_blank" class="d-flex align-items-center text-decoration-none">
      <img src="img/icon4.png" alt="icon4" class="me-1"/>
      <span class="text-dark">알로아</span>
    </a>
  </div>
  
  <!-- 플로팅 바 토글 버튼 -->
  <button id="floating-bar-toggle" @click="toggleFloatingBar" :class="{ 'hidden': isFloatingBarVisible }">
    <i class="bi bi-list"></i>
  </button>

  <!-- 메인 -->
  <main class="container-fluid mt-3">
    <sidebar-view v-if="!searchMode" 
                 :recent-docs="recentDocs" 
                 :popular-docs="popularDocs"
                 :all-tags="allTags"
                 :categories="categories"
                 @view-doc="viewDoc"
                 @filter-category="filterByCategory"
                 @filter-tag="filterByTag"
                 @random-doc="randomDoc"></sidebar-view>
    <section id="content">
      <component :is="currentView"
                 :doc="currentDoc"
                 :search-results="searchResults"
                 :prev-doc="prevDoc"
                 :next-doc="nextDoc"
                 :discussions="discussions"
                 :on-view="viewDoc"
                 :on-edit="editDoc"
                 :on-save="saveDoc"
                 @refresh-discussions="refreshDiscussions">
      </component>
    </section>
  </main>
</div>

<script src="js/app.js"></script>
</body>
</html>
