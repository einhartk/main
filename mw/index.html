<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>템플릿 챗봇 UI</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vuedraggable@next/dist/vuedraggable.umd.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/script-clean.js"></script>
  <link rel="stylesheet" href="assets/css/themes/theme-1.css" id="theme-css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body style="background-color: var(--background-color, #f9fafb);">
<div id="app" class="flex h-screen">

  <!-- 좌측 3칸: 채팅, 템플릿 선택, 커스터마이저 -->
  <div class="relative flex flex-col transition-all duration-300 ease-in-out" 
       :class="isMainSidebarOpen ? 'w-1/4' : 'w-12'"
       style="background-color: var(--surface-color, #ffffff); border-right: 1px solid var(--border-color, #e5e7eb);">
    <div class="absolute right-2 top-2 z-10">
      <button @click="toggleMainSidebar" class="p-1 rounded-full transition-colors" style="color: var(--text-color, #1f2937);" onmouseover="this.style.backgroundColor='var(--border-color, #e5e7eb)'" onmouseout="this.style.backgroundColor='transparent'">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path v-if="isMainSidebarOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          <path v-else stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </div>
    <div v-if="isMainSidebarOpen" class="p-4 overflow-auto flex-1 flex flex-col gap-4">
      <!-- 채팅 -->
      <div class="chat-container flex flex-col flex-1 border rounded p-2 overflow-auto" style="background-color: var(--background-color, #f9fafb); border-color: var(--border-color, #e5e7eb);">
        <div v-for="msg in chatHistory" :key="msg.id" class="mb-2">
          <div v-if="msg.type==='user'" class="text-right font-semibold" style="color: var(--primary-color, #3b82f6);">{{ msg.text }}</div>
          <div v-else class="text-left font-semibold" style="color: var(--text-color, #1f2937);">{{ msg.text }}</div>
        </div>
      </div>
    <div class="flex gap-2">
      <input v-model="chatInput" @keyup.enter="sendChat" type="text" placeholder="메시지 입력"
             class="flex-1 border p-2 rounded" style="border-color: var(--border-color, #e5e7eb); background-color: var(--surface-color, #ffffff); color: var(--text-color, #1f2937);">
      <button @click="sendChat" class="px-4 py-2 rounded transition-colors" style="color: var(--text-color, #ffffff); background-color: var(--primary-color, #3b82f6);" onmouseover="this.style.backgroundColor='var(--primary-hover, #2563eb)'" onmouseout="this.style.backgroundColor='var(--primary-color, #3b82f6)'">전송</button>
    </div>

    <!-- 테마 선택기 -->
    <div class="border rounded p-3" style="background-color: var(--background-color, #f9fafb); border-color: var(--border-color, #e5e7eb);">
      <h3 class="font-bold mb-2 text-sm" style="color: var(--text-color, #1f2937);">테마 선택</h3>
      <select v-model="currentTheme" @change="changeTheme" class="w-full border p-2 rounded text-sm" style="border-color: var(--border-color, #e5e7eb); background-color: var(--surface-color, #ffffff); color: var(--text-color, #1f2937);">
        <option value="theme-1">테마 1 - 파란색</option>
        <option value="theme-2">테마 2 - 초록색</option>
        <option value="theme-3">테마 3 - 미니멀</option>
        <option value="theme-4">테마 4 - 다크모드</option>
        <option value="theme-5">테마 5 - 오렌지골드</option>
        <option value="theme-6">테마 6 - 보라핑크</option>
        <option value="theme-7">테마 7 - 레드다크</option>
        <option value="theme-8">테마 8 - 테일청록</option>
      </select>
    </div>

    <!-- 카테고리 필터 -->
    <select v-model="categoryFilter" class="border p-2 rounded" style="border-color: var(--border-color, #e5e7eb); background-color: var(--surface-color, #ffffff); color: var(--text-color, #1f2937);">
      <option value="">전체</option>
      <option v-for="cat in categories" :key="cat" :value="cat">{{ cat }}</option>
    </select>

    <!-- 템플릿 리스트 -->
    <div class="flex-1 overflow-auto">
      <h3 class="font-bold mb-2" style="color: var(--text-color, #1f2937);">템플릿</h3>
      <div v-for="tpl in filteredTemplates" :key="tpl.id"
           class="border rounded p-2 mb-2 flex justify-between items-center cursor-pointer transition-colors"
           style="background-color: var(--background-color, #f9fafb); border-color: var(--border-color, #e5e7eb);"
           @click="toggleTemplate(tpl)"
           onmouseover="this.style.backgroundColor='var(--border-color, #e5e7eb)'"
           onmouseout="this.style.backgroundColor='var(--background-color, #f9fafb)'">
        <span style="color: var(--text-color, #1f2937);">{{ tpl.name }}</span>
        <span class="text-sm" style="color: var(--text-secondary, #6b7280);">{{ tpl.applied ? 'ON' : 'OFF' }}</span>
      </div>
    </div>

    <!-- 커스터마이저 -->
    <div>
      <h3 class="font-bold mb-2" style="color: var(--text-color, #1f2937);">커스터마이저</h3>
      <input type="color" v-model="textColor" class="w-full h-8 border rounded mb-2" style="border-color: var(--border-color, #e5e7eb);">
      <button @click="applyColors" class="w-full py-1 rounded transition-colors" style="color: var(--text-color, #ffffff); background-color: var(--success-color, #10b981);" onmouseover="this.style.backgroundColor='#059669'" onmouseout="this.style.backgroundColor='var(--success-color, #10b981)'">적용</button>
      <button @click="downloadHTML" class="w-full mt-2 py-1 rounded transition-colors" style="color: var(--text-color, #ffffff); background-color: var(--warning-color, #f59e0b);" onmouseover="this.style.backgroundColor='#d97706'" onmouseout="this.style.backgroundColor='var(--warning-color, #f59e0b)'">HTML 다운로드</button>
    </div>

    </div>
  </div>

  <!-- 우측 9칸: 미리보기 -->
  <div class="flex-1 p-4 flex flex-col h-screen transition-all duration-300 ease-in-out" style="background-color: var(--background-color, #f9fafb);">
    <div class="mb-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-lg" style="color: var(--text-color, #1f2937);">미리보기</h3>
        <div class="flex space-x-2">
          <button @click="toggleMobilePreview" class="flex items-center px-3 py-1.5 rounded-md transition-colors" style="color: var(--text-color, #ffffff); background-color: var(--primary-color, #3b82f6);" onmouseover="this.style.backgroundColor='var(--primary-hover, #2563eb)'" onmouseout="this.style.backgroundColor='var(--primary-color, #3b82f6)'">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
            </svg>
            모바일 미리보기
          </button>
        </div>
      </div>
      
      <div class="mt-2 rounded-lg shadow overflow-auto flex-1" style="background-color: var(--surface-color, #ffffff);">
        <!-- Preview Header with Header Template -->
        <div class="border-b" style="border-color: var(--border-color, #e5e7eb); background-color: var(--surface-color, #ffffff);">
          <template v-for="tpl in templates" :key="'header-'+tpl.id">
            <div v-if="tpl && tpl.alwaysVisible && tpl.applied && tpl.component" class="w-full">
              <component
                :is="tpl.component"
                v-bind="tpl.props || {}"
              ></component>
            </div>
          </template>
        </div>
        
        <!-- Content Area -->
        <div class="flex min-h-0 flex-1 flex-col">
          <div class="flex min-h-0 flex-1">
            <!-- Preview Sidebar -->
            <div v-if="templates.some(t => t.isSidebar && t.applied)" 
                 class="preview-sidebar"
                 :class="isPreviewSidebarOpen ? 'open' : 'closed'">
              <div class="preview-sidebar-toggle">
                <button @click="togglePreviewSidebar" class="p-1 rounded-full transition-colors" style="color: var(--text-color, #1f2937);" onmouseover="this.style.backgroundColor='var(--border-color, #e5e7eb)'" onmouseout="this.style.backgroundColor='transparent'">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path v-if="isPreviewSidebarOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    <path v-else stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                  </svg>
                </button>
              </div>
              <div v-if="isPreviewSidebarOpen" class="preview-sidebar-content">
                <template v-for="tpl in templates" :key="'sidebar-'+tpl.id">
                  <div v-if="tpl && tpl.isSidebar && tpl.applied && tpl.component" class="w-full">
                    <component
                      :is="tpl.component"
                      v-bind="tpl.props || {}"
                    ></component>
                  </div>
                </template>
              </div>
            </div>
            
            <!-- Main Content -->
            <div class="flex-1 overflow-auto p-4">
              <draggable
                v-model="mainContentTemplates"
                v-bind="dragOptions"
                @start="onDragStart"
                @end="onDragEnd"
                item-key="id"
                class="space-y-0"
              >
                <template #item="{ element: tpl, index }">
                  <div 
                    class="relative group transition-all duration-200 hover:bg-gray-50"
                    :class="{ 'pt-2': index > 0 }"
                    :data-template-id="tpl.id"
                  >
                    <div class="px-4 py-2">
                      <component
                        :is="tpl.component"
                        v-bind="tpl.props || {}"
                        class="cursor-move"
                      ></component>
                    </div>
                    <div class="h-px bg-gray-100 mx-4 group-hover:bg-gray-200 transition-colors"></div>
                  </div>
                </template>
                <template #footer>
                  <div v-if="mainContentTemplates.length === 0" class="text-center py-12 text-gray-500">
                    <p>템플릿을 추가하여 시작하세요</p>
                  </div>
                </template>
              </draggable>
            </div>
          </div>
        </div>
        
        <!-- Preview Footer -->
        <div class="border-t border-gray-200 bg-white">
          <template v-for="tpl in templates" :key="'footer-'+tpl.id">
            <div v-if="tpl && tpl.name === 'footer' && tpl.applied && tpl.component" class="w-full">
              <component
                :is="tpl.component"
                v-bind="tpl.props || {}"
              ></component>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Download HTML Button -->
  <div class="fixed bottom-4 right-4 z-40">
    <button @click="downloadHTML" class="p-3 rounded-full shadow-lg transition-colors" style="color: var(--text-color, #ffffff); background-color: var(--success-color, #10b981);" onmouseover="this.style.backgroundColor='#059669'" onmouseout="this.style.backgroundColor='var(--success-color, #10b981)'" title="HTML 다운로드">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
      </svg>
    </button>
  </div>

  <!-- Mobile Preview Modal -->
  <div v-if="showMobilePreview" class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background-color: rgba(0, 0, 0, 0.5);" @click.self="toggleMobilePreview">
    <div class="relative w-full max-w-md mx-auto my-8">
      <!-- Smartphone Frame -->
      <div class="relative mx-auto rounded-[40px] p-2 border-[14px] shadow-2xl overflow-hidden" style="width: 100%; max-width: 375px; height: 700px; max-height: 90vh; background-color: var(--surface-color, #000000); border-color: var(--surface-color, #000000);">
        <!-- Status Bar -->
        <div class="flex justify-between items-center px-6 py-2" style="background-color: var(--surface-color, #000000); color: var(--text-color, #ffffff);">
          <div class="text-sm font-medium">{{ getCurrentTime() }}</div>
          <div class="flex items-center space-x-2">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20Z" fill="white"/>
              <path d="M12.89 7.76L14.41 9.29C14.8 9.68 15 10.17 15 10.69V16H13V11.41L12.89 11.3L10.59 9H7V11H9.59L12.89 14.3L11 16.18V18H17V16H12.5L14.3 14.23C14.69 13.84 14.89 13.35 14.89 12.83V10.69C14.89 9.62 14.11 8.76 13.12 8.76H12.89Z" fill="white"/>
            </svg>
            <svg width="20" height="14" viewBox="0 0 24 14" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M22 2H2C0.9 2 0 2.9 0 4V10C0 11.1 0.9 12 2 12H22C23.1 12 24 11.1 24 10V4C24 2.9 23.1 2 22 2ZM22 10H2V4H22V10Z" fill="white"/>
              <path d="M7 13H17V14H7V13Z" fill="white"/>
            </svg>
          </div>
        </div>
        
        <!-- Device Screen Content -->
        <div class="mobile-device-screen-content" style="background-color: var(--background-color, #ffffff);">
          <!-- Scrollable content with hidden scrollbar -->
          <div class="mobile-preview-scrollable">
            <!-- Main Content Container -->
            <div class="mobile-preview-main-content">
          <!-- Header - Rendered separately -->
          <template v-for="tpl in templates" :key="'mobile-header-'+tpl.id">
            <template v-if="tpl.name === 'header' && tpl.applied && tpl.component">
              <component
                :is="tpl.component"
                v-bind="tpl.props || {}"
                :class="{ 'border-b-0': true }"
              ></component>
            </template>
          </template>
          
          <!-- Templates in current order -->
          <div v-for="tpl in mainContentTemplates" :key="'mobile-'+tpl.id" class="w-full">
            <!-- Main Content -->
            <template v-if="!tpl.isSidebar && !tpl.alwaysVisible && tpl.name !== 'footer' && tpl.applied && tpl.component">
              <component
                :is="tpl.component"
                v-bind="tpl.props || {}"
                :class="{ 'border-b-0': true }"
              ></component>
            </template>
          </div>
          
          <!-- Footer - Rendered separately -->
          <template v-for="tpl in templates" :key="'mobile-footer-'+tpl.id">
            <template v-if="tpl.name === 'footer' && tpl.applied && tpl.component">
              <component
                :is="tpl.component"
                v-bind="tpl.props || {}"
                class="mt-auto border-t-0"
              ></component>
            </template>
          </template>
          
          <!-- Empty State -->
          <div v-if="!appliedTemplates.length" class="flex items-center justify-center h-full text-gray-500 p-4">
            <div class="text-center">
              <div class="text-lg font-medium mb-2">콘텐츠가 없습니다</div>
              <div class="text-sm text-gray-400">템플릿을 추가해주세요</div>
            </div>
          </div>
          
          <!-- Home Indicator -->
          <div class="home-indicator"></div>
        </div>
      </div>
      
      <!-- Close Button -->
      <button 
        @click="toggleMobilePreview" 
        class="absolute -top-10 right-0 p-2 rounded-full shadow-lg transition-colors"
        style="background-color: var(--surface-color, #ffffff); color: var(--text-color, #1f2937);"
        onmouseover="this.style.backgroundColor='var(--border-color, #e5e7eb)'"
        onmouseout="this.style.backgroundColor='var(--surface-color, #ffffff)'"
        aria-label="Close preview"
      >
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>
  
  <!-- Floating Bar - Rendered separately -->
  <template v-for="tpl in templates" :key="'floating-'+tpl.id">
    <div v-if="tpl && tpl.name === 'floating-bar' && tpl.applied && tpl.component" class="floating-bar">
      <component
        :is="tpl.component"
        v-bind="tpl.props || {}"
      ></component>
    </div>
  </template>
  
  

<script>
    // Vue app is already initialized in script-clean.js
    // Just make sure it loads properly
    console.log('index.html script loaded, waiting for Vue app...');
  </script>

</body>
</html>
