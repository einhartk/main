<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>템플릿 챗봇 UI</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vuedraggable@next/dist/vuedraggable.umd.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="bg-gray-100">
<div id="app" class="flex h-screen">

  <!-- 좌측 3칸: 채팅, 템플릿 선택, 커스터마이저 -->
  <div class="relative bg-white flex flex-col transition-all duration-300 ease-in-out" 
       :class="isMainSidebarOpen ? 'w-1/4' : 'w-12'">
    <div class="absolute right-2 top-2 z-10">
      <button @click="toggleMainSidebar" class="p-1 rounded-full hover:bg-gray-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path v-if="isMainSidebarOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          <path v-else stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </div>
    <div v-if="isMainSidebarOpen" class="p-4 overflow-auto flex-1 flex flex-col gap-4">
      <!-- 채팅 -->
      <div class="flex flex-col flex-1 border rounded p-2 bg-gray-50 overflow-auto">
        <div v-for="msg in chatHistory" :key="msg.id" class="mb-2">
          <div v-if="msg.type==='user'" class="text-right text-blue-600">{{ msg.text }}</div>
          <div v-else class="text-left text-gray-700 font-semibold">{{ msg.text }}</div>
        </div>
      </div>
    <div class="flex gap-2">
      <input v-model="chatInput" @keyup.enter="sendChat" type="text" placeholder="메시지 입력"
             class="flex-1 border p-2 rounded">
      <button @click="sendChat" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">전송</button>
    </div>

    <!-- 카테고리 필터 -->
    <select v-model="categoryFilter" class="border p-2 rounded">
      <option value="">전체</option>
      <option v-for="cat in categories" :key="cat" :value="cat">{{ cat }}</option>
    </select>

    <!-- 템플릿 리스트 -->
    <div class="flex-1 overflow-auto">
      <h3 class="font-bold mb-2">템플릿</h3>
      <div v-for="tpl in filteredTemplates" :key="tpl.id"
           class="border rounded p-2 mb-2 flex justify-between items-center bg-gray-50 cursor-pointer hover:bg-gray-100"
           @click="toggleTemplate(tpl)">
        <span>{{ tpl.name }}</span>
        <span class="text-sm text-gray-500">{{ tpl.applied ? 'ON' : 'OFF' }}</span>
      </div>
    </div>

    <!-- 커스터마이저 -->
    <div>
      <h3 class="font-bold mb-2">커스터마이저</h3>
      <input type="color" v-model="textColor" class="w-full h-8 border rounded mb-2">
      <button @click="applyColors" class="w-full bg-green-500 text-white py-1 rounded hover:bg-green-600">적용</button>
      <button @click="downloadHTML" class="w-full mt-2 bg-yellow-500 text-white py-1 rounded hover:bg-yellow-600">HTML 다운로드</button>
    </div>

    </div>
  </div>

  <!-- 우측 9칸: 미리보기 -->
  <div class="flex-1 p-4 bg-gray-100 flex flex-col h-screen transition-all duration-300 ease-in-out">
    <div class="mb-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-lg">미리보기</h3>
        <div class="flex space-x-2">
          <button @click="toggleMobilePreview" class="flex items-center px-3 py-1.5 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
            </svg>
            모바일 미리보기
          </button>
        </div>
      </div>
      
      <div class="mt-2 bg-white rounded-lg shadow overflow-auto flex-1">
        <!-- Preview Header with Header Template -->
        <div class="border-b border-gray-200 bg-white">
          <template v-for="tpl in templates" :key="'header-'+tpl.id">
            <div v-if="tpl && tpl.alwaysVisible && tpl.applied && tpl.component" class="w-full">
              <component
                :is="tpl.component"
                v-bind="tpl.props || {}"
              ></component>
            </div>
          </template>
        </div>
        
        <!-- Content Area -->
        <div class="flex min-h-0 flex-1 flex-col">
          <div class="flex min-h-0 flex-1">
            <!-- Preview Sidebar -->
            <div v-if="templates.some(t => t.isSidebar && t.applied)" 
                 class="preview-sidebar"
                 :class="isPreviewSidebarOpen ? 'open' : 'closed'">
              <div class="preview-sidebar-toggle">
                <button @click="togglePreviewSidebar" class="p-1 rounded-full hover:bg-gray-200">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path v-if="isPreviewSidebarOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    <path v-else stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                  </svg>
                </button>
              </div>
              <div v-if="isPreviewSidebarOpen" class="preview-sidebar-content">
                <template v-for="tpl in templates" :key="'sidebar-'+tpl.id">
                  <div v-if="tpl && tpl.isSidebar && tpl.applied && tpl.component" class="w-full">
                    <component
                      :is="tpl.component"
                      v-bind="tpl.props || {}"
                    ></component>
                  </div>
                </template>
              </div>
            </div>
            
            <!-- Main Content -->
            <div class="flex-1 overflow-auto p-4">
              <draggable
                v-model="mainContentTemplates"
                v-bind="dragOptions"
                @start="onDragStart"
                @end="onDragEnd"
                item-key="id"
                class="space-y-0"
              >
                <template #item="{ element: tpl, index }">
                  <div 
                    class="relative group transition-all duration-200 hover:bg-gray-50"
                    :class="{ 'pt-2': index > 0 }"
                    :data-template-id="tpl.id"
                  >
                    <div class="px-4 py-2">
                      <component
                        :is="tpl.component"
                        v-bind="tpl.props || {}"
                        class="cursor-move"
                      ></component>
                    </div>
                    <div class="h-px bg-gray-100 mx-4 group-hover:bg-gray-200 transition-colors"></div>
                  </div>
                </template>
                <template #footer>
                  <div v-if="mainContentTemplates.length === 0" class="text-center py-12 text-gray-500">
                    <p>템플릿을 추가하여 시작하세요</p>
                  </div>
                </template>
              </draggable>
            </div>
          </div>
        </div>
        
        <!-- Preview Footer -->
        <div class="border-t border-gray-200 bg-white">
          <template v-for="tpl in templates" :key="'footer-'+tpl.id">
            <div v-if="tpl && tpl.name === 'footer' && tpl.applied && tpl.component" class="w-full">
              <component
                :is="tpl.component"
                v-bind="tpl.props || {}"
              ></component>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Download HTML Button -->
  <div class="fixed bottom-4 right-4 z-40">
    <button @click="downloadHTML" class="bg-green-500 text-white p-3 rounded-full shadow-lg hover:bg-green-600 transition-colors" title="HTML 다운로드">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
      </svg>
    </button>
  </div>

  <!-- Mobile Preview Modal -->
  <div v-if="showMobilePreview" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" @click.self="toggleMobilePreview">
    <div class="relative w-full max-w-md mx-auto my-8">
      <!-- Smartphone Frame -->
      <div class="relative mx-auto bg-black rounded-[40px] p-2 border-[14px] border-gray-900 shadow-2xl overflow-hidden" style="width: 100%; max-width: 375px; height: 700px; max-height: 90vh;">
        <!-- Status Bar -->
        <div class="flex justify-between items-center px-6 py-2 bg-black text-white">
          <div class="text-sm font-medium">{{ getCurrentTime() }}</div>
          <div class="flex items-center space-x-2">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20Z" fill="white"/>
              <path d="M12.89 7.76L14.41 9.29C14.8 9.68 15 10.17 15 10.69V16H13V11.41L12.89 11.3L10.59 9H7V11H9.59L12.89 14.3L11 16.18V18H17V16H12.5L14.3 14.23C14.69 13.84 14.89 13.35 14.89 12.83V10.69C14.89 9.62 14.11 8.76 13.12 8.76H12.89Z" fill="white"/>
            </svg>
            <svg width="20" height="14" viewBox="0 0 24 14" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M22 2H2C0.9 2 0 2.9 0 4V10C0 11.1 0.9 12 2 12H22C23.1 12 24 11.1 24 10V4C24 2.9 23.1 2 22 2ZM22 10H2V4H22V10Z" fill="white"/>
              <path d="M7 13H17V14H7V13Z" fill="white"/>
            </svg>
          </div>
        </div>
        
        <!-- Device Screen Content -->
        <div class="mobile-device-screen-content">
          <!-- Scrollable content with hidden scrollbar -->
          <div class="mobile-preview-scrollable">
            <!-- Main Content Container -->
            <div class="mobile-preview-main-content">
          <!-- Templates in current order -->
          <div v-for="tpl in mainContentTemplates" :key="'mobile-'+tpl.id" class="w-full">
            <!-- Header -->
            <template v-if="tpl.name === 'header' && tpl.applied && tpl.component">
              <component
                :is="tpl.component"
                v-bind="tpl.props || {}"
                :class="{ 'border-b-0': true }"
              ></component>
            </template>
            
            <!-- Main Content -->
            <div v-else-if="!tpl.isSidebar && !tpl.alwaysVisible && tpl.name !== 'footer' && tpl.applied && tpl.component" class="w-full">
              <component
                :is="tpl.component"
                v-bind="tpl.props || {}"
                :class="{ 'border-b-0': true }"
              ></component>
            </div>
            
            <!-- Footer -->
            <template v-else-if="tpl.name === 'footer' && tpl.applied && tpl.component">
              <component
                :is="tpl.component"
                v-bind="tpl.props || {}"
                class="mt-auto border-t-0"
              ></component>
            </template>
          </div>
          
          <!-- Empty State -->
          <div v-if="!appliedTemplates.length" class="flex items-center justify-center h-full text-gray-500 p-4">
            <div class="text-center">
              <div class="text-lg font-medium mb-2">콘텐츠가 없습니다</div>
              <div class="text-sm text-gray-400">템플릿을 추가해주세요</div>
            </div>
          </div>
          
          <!-- Home Indicator -->
          <div class="home-indicator"></div>
        </div>
      </div>
      
      <!-- Close Button -->
      <button 
        @click="toggleMobilePreview" 
        class="absolute -top-10 right-0 bg-white p-2 rounded-full shadow-lg text-gray-700 hover:bg-gray-100 transition-colors"
        aria-label="Close preview"
      >
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>
  
  <!-- Floating Bar - Rendered separately -->
  <template v-for="tpl in templates" :key="'floating-'+tpl.id">
    <div v-if="tpl && tpl.name === 'floating-bar' && tpl.applied && tpl.component" class="floating-bar">
      <component
        :is="tpl.component"
        v-bind="tpl.props || {}"
      ></component>
    </div>
  </template>
  
  <script src="assets/js/script-clean.js"></script>

</body>
</html>
