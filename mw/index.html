<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>템플릿 챗봇 UI</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Vue.Draggable.Next/2.2.1/vue.draggable.next.umd.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-100">
<div id="app" class="flex h-screen">
  <!-- 좌측 3칸 -->
  <div class="w-1/4 p-4 bg-white overflow-auto flex flex-col gap-4">
    <!-- 채팅 -->
    <div class="flex flex-col flex-1 border rounded p-2 bg-gray-50 overflow-auto">
      <div v-for="msg in chatHistory" :key="msg.id" class="mb-2">
        <div v-if="msg.type==='user'" class="text-right text-blue-600">{{ msg.text }}</div>
        <div v-else class="text-left text-gray-700 font-semibold">{{ msg.text }}</div>
      </div>
    </div>
    <div class="flex gap-2">
      <input v-model="chatInput" @keyup.enter="sendChat" type="text" placeholder="메시지 입력"
             class="flex-1 border p-2 rounded">
      <button @click="sendChat" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">전송</button>
    </div>

    <!-- 카테고리 필터 -->
    <select v-model="categoryFilter" class="border p-2 rounded">
      <option value="">전체</option>
      <option v-for="cat in categories" :key="cat" :value="cat">{{ cat }}</option>
    </select>

    <!-- 템플릿 리스트 -->
    <div class="flex-1 overflow-auto">
      <h3 class="font-bold mb-2">템플릿</h3>
      <div v-for="tpl in filteredTemplates" :key="tpl.id"
           class="border rounded p-2 mb-2 flex justify-between items-center bg-gray-50 cursor-pointer hover:bg-gray-100"
           @click="toggleTemplate(tpl)">
        <span>{{ tpl.name }}</span>
        <span class="text-sm text-gray-500">{{ tpl.applied ? 'ON' : 'OFF' }}</span>
      </div>
    </div>

    <!-- 커스터마이저 -->
    <div>
      <h3 class="font-bold mb-2">커스터마이저</h3>
      <label>글자색:</label>
      <input type="color" v-model="textColor" class="w-full h-8 border rounded mb-2">
      <button @click="applyColor" class="bg-green-500 text-white px-3 py-1 rounded hover:bg-green-600">적용</button>
    </div>

    <button @click="downloadHTML" class="mt-2 bg-purple-500 text-white px-3 py-1 rounded hover:bg-purple-600">HTML 다운로드</button>
  </div>

  <!-- 우측 9칸: 미리보기 -->
  <div class="w-3/4 p-4 overflow-auto bg-gray-100">
    <draggable v-model="appliedTemplates" item-key="id" class="flex flex-col gap-4">
      <template #item="{element:tpl}">
        <div class="p-2 bg-white rounded shadow">
          <h4 class="font-bold mb-2 text-gray-700">{{ tpl.name }}</h4>
          <div v-html="tpl.html"></div>
        </div>
      </template>
    </draggable>
  </div>
</div>

<script src="assets/js/script.js"></script>
</body>
</html>
