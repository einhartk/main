<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>템플릿 챗봇 UI</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vuedraggable@next/dist/vuedraggable.umd.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-gray-100">
<div id="app" class="flex h-screen">

  <!-- 좌측 3칸: 채팅, 템플릿 선택, 커스터마이저 -->
  <div class="relative bg-white flex flex-col transition-all duration-300 ease-in-out" 
       :class="isMainSidebarOpen ? 'w-1/4' : 'w-12'">
    <div class="absolute right-2 top-2 z-10">
      <button @click="toggleMainSidebar" class="p-1 rounded-full hover:bg-gray-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path v-if="isMainSidebarOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          <path v-else stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </button>
    </div>
    <div v-if="isMainSidebarOpen" class="p-4 overflow-auto flex-1 flex flex-col gap-4">
      <!-- 채팅 -->
      <div class="flex flex-col flex-1 border rounded p-2 bg-gray-50 overflow-auto">
        <div v-for="msg in chatHistory" :key="msg.id" class="mb-2">
          <div v-if="msg.type==='user'" class="text-right text-blue-600">{{ msg.text }}</div>
          <div v-else class="text-left text-gray-700 font-semibold">{{ msg.text }}</div>
        </div>
      </div>
    <div class="flex gap-2">
      <input v-model="chatInput" @keyup.enter="sendChat" type="text" placeholder="메시지 입력"
             class="flex-1 border p-2 rounded">
      <button @click="sendChat" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">전송</button>
    </div>

    <!-- 카테고리 필터 -->
    <select v-model="categoryFilter" class="border p-2 rounded">
      <option value="">전체</option>
      <option v-for="cat in categories" :key="cat" :value="cat">{{ cat }}</option>
    </select>

    <!-- 템플릿 리스트 -->
    <div class="flex-1 overflow-auto">
      <h3 class="font-bold mb-2">템플릿</h3>
      <div v-for="tpl in filteredTemplates" :key="tpl.id"
           class="border rounded p-2 mb-2 flex justify-between items-center bg-gray-50 cursor-pointer hover:bg-gray-100"
           @click="toggleTemplate(tpl)">
        <span>{{ tpl.name }}</span>
        <span class="text-sm text-gray-500">{{ tpl.applied ? 'ON' : 'OFF' }}</span>
      </div>
    </div>

    <!-- 커스터마이저 -->
    <div>
      <h3 class="font-bold mb-2">커스터마이저</h3>
      <input type="color" v-model="textColor" class="w-full h-8 border rounded mb-2">
      <button @click="applyColors" class="w-full bg-green-500 text-white py-1 rounded hover:bg-green-600">적용</button>
      <button @click="downloadHTML" class="w-full mt-2 bg-yellow-500 text-white py-1 rounded hover:bg-yellow-600">HTML 다운로드</button>
    </div>

    </div>
  </div>

  <!-- 우측 9칸: 미리보기 -->
  <div class="flex-1 p-4 bg-gray-100 flex flex-col h-screen transition-all duration-300 ease-in-out">
    <div class="mb-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-lg">미리보기</h3>
        <div class="flex space-x-2">
          <button @click="toggleMobilePreview" class="flex items-center px-3 py-1.5 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
            </svg>
            모바일 미리보기
          </button>
        </div>
      </div>
      
      <div class="mt-2 bg-white rounded-lg shadow overflow-auto flex-1">
        <!-- Preview Header with Header Template -->
        <div class="border-b border-gray-200 bg-white">
          <template v-for="tpl in templates" :key="'header-'+tpl.id">
            <div v-if="tpl && tpl.alwaysVisible && tpl.applied && tpl.component" class="w-full">
              <component
                :is="tpl.component"
                v-bind="tpl.props || {}"
              ></component>
            </div>
          </template>
        </div>
        
        <!-- Content Area -->
        <div class="flex min-h-0 flex-1 flex-col">
          <div class="flex min-h-0 flex-1">
            <!-- Preview Sidebar -->
            <div class="relative">
              <div 
                v-if="hasSidebar && isPreviewSidebarOpen" 
                class="w-64 border-r border-gray-200 bg-gray-50 overflow-y-auto h-full"
              >
                <div class="absolute right-2 top-2 z-10">
                  <button @click="togglePreviewSidebar" class="p-1 rounded-full hover:bg-gray-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>
                </div>
                <template v-for="tpl in templates" :key="tpl.id">
                  <component
                    v-if="tpl && tpl.isSidebar && tpl.applied && tpl.component"
                    :is="tpl.component"
                    v-bind="tpl.props || {}"
                    class="h-full"
                  ></component>
                </template>
              </div>
              <button 
                v-else-if="hasSidebar" 
                @click="togglePreviewSidebar"
                class="absolute left-0 top-1/2 -translate-y-1/2 bg-white border border-gray-200 rounded-r-full p-2 shadow-md hover:bg-gray-100 z-10"
              >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                </svg>
              </button>
            </div>
            
            <!-- Main Content -->
            <div class="flex-1 overflow-auto p-4">
              <draggable
                v-model="mainContentTemplates"
                v-bind="dragOptions"
                @start="onDragStart"
                @end="onDragEnd"
                item-key="id"
                class="space-y-0"
              >
                <template #item="{ element: tpl, index }">
                  <div 
                    class="relative group transition-all duration-200 hover:bg-gray-50"
                    :class="{ 'pt-2': index > 0 }"
                    :data-template-id="tpl.id"
                  >
                    <div class="px-4 py-2">
                      <component
                        :is="tpl.component"
                        v-bind="tpl.props || {}"
                        class="cursor-move"
                      ></component>
                    </div>
                    <div class="h-px bg-gray-100 mx-4 group-hover:bg-gray-200 transition-colors"></div>
                  </div>
                </template>
                <template #footer>
                  <div v-if="mainContentTemplates.length === 0" class="text-center py-12 text-gray-500">
                    <p>템플릿을 추가하여 시작하세요</p>
                  </div>
                </template>
              </draggable>
            </div>
          </div>
          
          <!-- Footer Section -->
          <div class="border-t border-gray-200 bg-white w-full">
            <template v-for="tpl in templates" :key="'footer-'+tpl.id">
              <div v-if="tpl && tpl.name === 'footer' && tpl.applied && tpl.component" class="w-full">
                <component
                  :is="tpl.component"
                  v-bind="tpl.props || {}"
                ></component>
              </div>
            </template>
          </div>
        </div>
  </div>
  
  <!-- Download HTML Button -->
  <div class="fixed bottom-4 right-4 z-40">
    <button @click="downloadHTML" class="bg-green-500 text-white p-3 rounded-full shadow-lg hover:bg-green-600 transition-colors" title="HTML 다운로드">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
      </svg>
    </button>
  </div>

  <!-- Mobile Preview Modal -->
  <div v-if="showMobilePreview" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" @click.self="toggleMobilePreview">
    <div class="relative w-full max-w-md mx-auto my-8">
      <!-- Smartphone Frame -->
      <div class="relative mx-auto bg-black rounded-[40px] p-2 border-[14px] border-gray-900 shadow-2xl overflow-hidden" style="width: 100%; max-width: 375px; height: 700px; max-height: 90vh;">
        <!-- Status Bar -->
        <div class="flex justify-between items-center px-6 py-2 bg-black text-white">
          <div class="text-sm font-medium">{{ getCurrentTime() }}</div>
          <div class="flex items-center space-x-2">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20Z" fill="white"/>
              <path d="M12.89 7.76L14.41 9.29C14.8 9.68 15 10.17 15 10.69V16H13V11.41L12.89 11.3L10.59 9H7V11H9.59L12.89 14.3L11 16.18V18H17V16H12.5L14.3 14.23C14.69 13.84 14.89 13.35 14.89 12.83V10.69C14.89 9.62 14.11 8.76 13.12 8.76H12.89Z" fill="white"/>
            </svg>
            <svg width="20" height="14" viewBox="0 0 24 14" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M22 2H2C0.9 2 0 2.9 0 4V10C0 11.1 0.9 12 2 12H22C23.1 12 24 11.1 24 10V4C24 2.9 23.1 2 22 2ZM22 10H2V4H22V10Z" fill="white"/>
              <path d="M7 13H17V14H7V13Z" fill="white"/>
            </svg>
          </div>
        </div>
        
        <!-- Device Screen Content -->
        <div style="
          position: relative;
          height: calc(100% - 40px);
          overflow: hidden;
          border-radius: 0 0 28px 28px;
          max-width: 100%;
          width: 100%;
        ">
          <!-- Scrollable content with hidden scrollbar -->
          <div style="
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
            width: 100%;
            box-sizing: border-box;
          ">
            <!-- Main Content Container -->
            <div style="
              width: 100%;
              height: 100%;
              overflow-y: auto;
              overflow-x: hidden;
              -ms-overflow-style: none;
              scrollbar-width: none;
              max-width: 100%;
              box-sizing: border-box;
            ">
              <!-- Hide scrollbar for WebKit browsers */
              <style>
                /* Hide scrollbar for Chrome, Safari and Opera */
                ::-webkit-scrollbar {
                  display: none;
                  width: 0;
                  height: 0;
                }
                /* Hide scrollbar for IE, Edge and Firefox */
                * {
                  -ms-overflow-style: none;  /* IE and Edge */
                  scrollbar-width: none;  /* Firefox */
                }
              </style>
          <!-- Templates in current order -->
          <div v-for="tpl in mainContentTemplates" :key="'mobile-'+tpl.id" class="w-full">
            <!-- Header -->
            <template v-if="tpl.name === 'header' && tpl.applied && tpl.component">
              <component
                :is="tpl.component"
                v-bind="tpl.props || {}"
                :class="{ 'border-b-0': true }"
              ></component>
            </template>
            
            <!-- Main Content -->
            <div v-else-if="!tpl.isSidebar && !tpl.alwaysVisible && tpl.name !== 'footer' && tpl.applied && tpl.component" class="w-full">
              <component
                :is="tpl.component"
                v-bind="tpl.props || {}"
                :class="{ 'border-b-0': true }"
              ></component>
            </div>
            
            <!-- Footer -->
            <template v-else-if="tpl.name === 'footer' && tpl.applied && tpl.component">
              <component
                :is="tpl.component"
                v-bind="tpl.props || {}"
                class="mt-auto border-t-0"
              ></component>
            </template>
          </div>
          
          <!-- Empty State -->
          <div v-if="!appliedTemplates.length" class="flex items-center justify-center h-full text-gray-500 p-4">
            <div class="text-center">
              <div class="text-lg font-medium mb-2">콘텐츠가 없습니다</div>
              <div class="text-sm text-gray-400">템플릿을 추가해주세요</div>
            </div>
          </div>
          
          <!-- Home Indicator -->
          <div class="home-indicator"></div>
        </div>
      </div>
      
      <!-- Close Button -->
      <button 
        @click="toggleMobilePreview" 
        class="absolute -top-10 right-0 bg-white p-2 rounded-full shadow-lg text-gray-700 hover:bg-gray-100 transition-colors"
        aria-label="Close preview"
      >
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

  <script src="assets/js/script-clean.js"></script>

  <style>
  /* Mobile Responsive Fixes */
  @media (max-width: 640px) {
    /* Reset default mobile styles */
    * {
      -webkit-text-size-adjust: 100%;
      -moz-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }
    
    /* Fix for mobile viewport units */
    .mobile-device-wrapper {
      height: 100vh !important;
      max-height: -webkit-fill-available !important;
    }
    
    /* Prevent horizontal overflow */
    body, html {
      overflow-x: hidden;
      width: 100%;
      position: relative;
    }
    
    /* Fix for mobile tap highlight */
    * {
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    }
    
    /* Better touch handling */
    a, button, [role="button"], input, textarea, select, label {
      touch-action: manipulation;
    }
    
    /* Prevent text size inflation */
    * {
      max-height: 1000000px;
      -webkit-text-size-adjust: none;
    }
  }
  
  /* Scrollbar Hide */
  .scrollbar-hide {
    -ms-overflow-style: none !important;  /* IE and Edge */
    scrollbar-width: none !important;  /* Firefox */
    overflow: -moz-scrollbars-none !important;  /* Old Firefox */
  }
  
  .scrollbar-hide::-webkit-scrollbar {
    display: none !important;  /* Chrome, Safari and Opera */
    width: 0 !important;
    height: 0 !important;
    background: transparent !important;
  }
  
  /* Drag and Drop Styles */
  .ghost {
    opacity: 0.5;
    background: #f0f9ff;
    border: 2px dashed #7dd3fc !important;
  }
  
  .chosen {
    background: #f0f9ff;
  }
  
  .sortable-drag {
    opacity: 1 !important;
    background: white;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    transform: scale(1.01);
    z-index: 10;
  }
  
  .drag-handle {
    cursor: move;
    transition: all 0.2s ease;
  }
  
  .drag-handle:hover {
    color: #3b82f6 !important;
  }

  /* Mobile Device Mockup */
  .device-mockup {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 90vh;
    margin: 0 auto;
    border-radius: 40px;
    background: #000;
    border: 14px solid #0a0a0a;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 
                0 0 0 2px #333,
                0 0 0 6px #666,
                0 0 0 10px #999,
                0 0 30px rgba(0, 0, 0, 0.7);
    overflow: hidden;
    padding: 0;
    box-sizing: border-box;
    transform: scale(0.95);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  
  .device-mockup:hover {
    transform: scale(0.97);
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6), 
                0 0 0 2px #444,
                0 0 0 8px #777,
                0 0 0 12px #aaa,
                0 0 40px rgba(0, 0, 0, 0.8);
  }

  /* Device Screen */
  .device-screen {
    position: relative;
    width: 100%;
    height: 100%;
    background: #fff;
    border-radius: 30px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Status Bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    background: #000;
    color: white;
    font-size: 14px;
    font-weight: 600;
    height: 44px;
    box-sizing: border-box;
  }

  .status-bar .icons {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  /* Home Indicator */
  .home-indicator {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    background: #000;
    border-radius: 100px;
  }

  /* Content Area */
  .template-container {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* Responsive Adjustments */
  @media (max-width: 400px) {
    .device-mockup {
      width: 100%;
      height: 100vh;
      max-height: 100%;
      border-radius: 0;
      padding: 0;
    }
    
    .device-screen {
      border-radius: 0;
    }
  }
  
  /* Content Container */
  .content-container {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    min-height: 0;
    max-height: 100%;
    margin: 0;
    padding: 0;
  }
  
  .device-screen .overflow-y-auto {
    min-height: 0 !important;
    max-height: 100% !important;
    overflow: auto !important;
    display: flex !important;
    flex-direction: column;
    position: relative;
    z-index: 1;
  }
  
  /* Force all direct children of device-screen to respect container */
  .device-screen > * {
    max-height: 100% !important;
    overflow: hidden !important;
  }
  
  /* Improve scrollbar appearance */
  .device-screen::-webkit-scrollbar {
    width: 4px !important;
  }
  
  .device-screen::-webkit-scrollbar-thumb {
    background-color: rgba(0,0,0,0.2) !important;
    border-radius: 2px !important;
  }
  
  /* Reset any potential conflicting styles */
  .device-frame * {
    box-sizing: border-box !important;
    max-width: 100% !important;
  }
  
  /* Force footer to stay within bounds */
  footer {
    position: relative !important;
    width: 100% !important;
    max-width: 100% !important;
    overflow: hidden !important;
    contain: strict;
  }
  
  /* Adjust scale based on screen size */
  @media (min-width: 1024px) {
    .mobile-device-wrapper {
      transform: scale(1);
    }
  }
  
  @media (max-width: 1023px) and (min-width: 768px) {
    .mobile-device-wrapper {
      max-width: 380px;
      height: 650px;
    }
  }
  
  @media (max-width: 767px) and (min-width: 480px) {
    .mobile-device-wrapper {
      max-width: 360px;
      height: 600px;
    }
  }
  
  @media (max-width: 479px) {
    .mobile-device-wrapper {
      max-width: 100%;
      height: 90vh;
      padding: 10px;
    }
    
    .device-frame {
      border-width: 8px;
      border-top-width: 30px;
      border-bottom-width: 30px;
      border-radius: 16px;
    }
  }

  /* Device notch */
  .device-notch {
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    width: 30%;
    height: 20px;
    background: #1f2937;
    border-bottom-left-radius: 12px;
    border-bottom-right-radius: 12px;
    z-index: 10;
  }

  /* Device screen */
  .device-screen {
    width: 100%;
    height: 100%;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* Responsive adjustments */
  @media (max-width: 480px) {
    .mobile-preview-container {
      padding: 0.5rem;
    }
    
    .device-frame {
      border-width: 8px;
      border-radius: 24px;
      height: 95vh;
    }
    
    .device-notch {
      height: 20px;
    }
  }

  /* Small devices (landscape phones, 576px and up) */
  @media (min-width: 576px) {
    .device-frame {
      max-width: 375px;
      height: 90vh;
    }
  }

  /* Medium devices (tablets, 768px and up) */
  @media (min-width: 768px) {
    .device-frame {
      max-width: 375px;
      height: 80vh;
    }
  }

  /* Large devices (desktops, 992px and up) */
  @media (min-width: 992px) {
    .device-frame {
      max-width: 375px;
      height: 80vh;
    }
  }

  /* Smooth transitions for the modal */
  .modal-enter-active,
  .modal-leave-active {
    transition: opacity 0.3s ease;
  }
  
  .modal-enter-from,
  .modal-leave-to {
    opacity: 0;
  }
  
  /* Custom scrollbar for mobile preview */
  .device-screen::-webkit-scrollbar {
    width: 4px;
  }
  
  .device-screen::-webkit-scrollbar-track {
    background: #f1f1f1;
  }
  
  .device-screen::-webkit-scrollbar-thumb {
    background: #888;
    border-radius: 2px;
  }
  
  .device-screen::-webkit-scrollbar-thumb:hover {
    background: #555;
  }
  
  /* Prevent body scroll when modal is open */
  body.modal-open {
    overflow: hidden;
    position: fixed;
    width: 100%;
    height: 100%;
  }
</style>
</body>
</html>
