<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mobile Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --device-width: 375px;
      --device-height: 812px;
      --device-frame: #111;
      --device-screen: #f8f8f8;
    }

    @media (max-width: 640px) {
      :root {
        --device-width: 100%;
        --device-height: 100vh;
      }
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .device-mockup {
      position: relative;
      width: var(--device-width);
      max-width: 100%;
      height: var(--device-height);
      max-height: 90vh;
      border-radius: 40px;
      background: var(--device-frame);
      padding: 12px;
      box-shadow: 0 10px 50px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .device-screen {
      position: relative;
      width: 100%;
      height: 100%;
      background: white;
      border-radius: 32px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .status-bar {
      height: 44px;
      background: #000;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-bar .time {
      font-weight: bold;
    }

    .status-bar .icons {
      display: flex;
      gap: 5px;
    }

    .template-container {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: #f8f8f8;
      position: relative;
    }

    .template-item {
      width: 100%;
    }

    /* Home indicator for iPhone X and above */
    .home-indicator {
      width: 134px;
      height: 5px;
      background: #000;
      border-radius: 3px;
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="device-mockup">
      <div class="device-screen">
        <!-- Status Bar -->
        <div class="status-bar">
          <div class="time">{{ currentTime }}</div>
          <div class="icons">
            <svg width="17" height="11" viewBox="0 0 17 11" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M16 1.5L8.5 9L1 1.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M8 12C10.2091 12 12 10.2091 12 8C12 5.79086 10.2091 4 8 4C5.79086 4 4 5.79086 4 8C4 10.2091 5.79086 12 8 12Z" fill="white"/>
              <path d="M8 16C12.4183 16 16 12.4183 16 8C16 3.58172 12.4183 0 8 0C3.58172 0 0 3.58172 0 8C0 12.4183 3.58172 16 8 16Z" fill="white" fill-opacity="0.2"/>
            </svg>
            <svg width="24" height="12" viewBox="0 0 24 12" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 1H23V11H20V1Z" fill="white"/>
              <path d="M15 4H18V11H15V4Z" fill="white"/>
              <path d="M10 7H13V11H10V7Z" fill="white"/>
              <path d="M5 10H8V11H5V10Z" fill="white"/>
            </svg>
          </div>
        </div>
        
        <!-- Main Content -->
        <div class="template-container">
          <div v-if="templates.length === 0" class="flex items-center justify-center h-full text-gray-500 p-4">
            <div class="text-center">
              <div class="text-lg font-medium mb-2">콘텐츠가 없습니다</div>
              <div class="text-sm text-gray-400 mb-4">편집기에서 템플릿을 추가해주세요</div>
              <button @click="requestTemplates" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-full text-sm font-medium transition-colors">
                새로고침
          </button>
          </div>
          
          <!-- Templates Content -->
          <div v-if="templates.length > 0" class="h-full overflow-y-auto">
            <div v-for="(template, index) in templates" :key="template.id || index" class="template-item">
              <div v-html="template.html" class="template-content"></div>
            </div>
          </div>
          
          <!-- Home Indicator -->
          <div class="home-indicator"></div>
        </div>
      </template>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    const { createApp, ref, onMounted, computed } = Vue;

    // Add a filter for truncating text
    const truncate = (value, length = 100) => {
      if (!value) return '';
      return value.length > length 
        ? value.substring(0, length) + '...' 
        : value;
    };

    const app = createApp({
      setup() {
        const templates = ref([]);
        const currentUrl = ref(window.location.href);
        const lastMessage = ref('');
        const isConnected = ref(false);
        const currentTime = ref('');
        
        // Update current time
        const updateTime = () => {
          const now = new Date();
          currentTime.value = now.getHours().toString().padStart(2, '0') + ':' + 
                            now.getMinutes().toString().padStart(2, '0');
        };
        
        // Update time every minute
        onMounted(() => {
          updateTime();
          setInterval(updateTime, 60000);
        });
        
        // Function to update templates from message
        const updateTemplatesFromMessage = (data) => {
          if (data && data.templates) {
            templates.value = data.templates;
            lastMessage.value = 'Templates updated';
          }
        };
        
        // Request templates from parent
        const requestTemplates = () => {
          window.parent.postMessage({ type: 'requestTemplates' }, '*');
          lastMessage.value = 'Requesting templates...';
        };
        
        // Handle messages from parent
        const handleMessage = (event) => {
          if (event.data && event.data.type === 'updateTemplates') {
            updateTemplatesFromMessage(event.data);
            isConnected.value = true;
          } else if (event.data && event.data.type === 'ping') {
            window.parent.postMessage({ type: 'pong' }, '*');
          }
        };
        
        onMounted(() => {
          window.addEventListener('message', handleMessage);
          requestTemplates();
          
          // Ping parent to establish connection
          const pingInterval = setInterval(() => {
            if (!isConnected.value) {
              requestTemplates();
                  htmlLength: tpl.html?.length || 0,
                  hasProps: !!tpl.props
                });
              });
            } else {
              error.value = 'Invalid templates data received';
              console.warn('Received invalid templates data:', event.data.templates);
              templates.value = [];
            }
          }
        }

        onMounted(() => {
          console.log('Mobile preview mounted at:', window.location.href);
          
          // Set up message listener first
          window.addEventListener('message', handleMessage);
          
          // Request initial templates after a short delay to ensure listener is ready
          setTimeout(() => {
            requestTemplates();
          }, 100);
          
          // Debug: Log state every 5 seconds
          const debugInterval = setInterval(() => {
            console.log('Current state:', {
              templatesCount: templates.value.length,
              lastMessage: lastMessage.value,
              error: error.value
            });
          }, 5000);
          
          return () => {
            clearInterval(debugInterval);
            window.removeEventListener('message', handleMessage);
          };
        });

        // Add a method to manually trigger template update
        window.updateTemplates = (newTemplates) => {
          console.log('Manual template update:', newTemplates);
          templates.value = newTemplates || [];
        };

        return { 
          templates,
          currentUrl,
          lastMessage,
          error,
          hasTemplates: () => templates.value.length > 0,
          requestTemplates
        };
        
        // Add the filter to the app
        app.config.globalProperties.$filters = {
          truncate
        };
      }
    });

    // Add error handling
    app.config.errorHandler = (err, vm, info) => {
      console.error('Vue error:', err);
      console.error('Error info:', info);
    };

    app.mount('#app');
  </script>
</body>
</html>
