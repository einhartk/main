<section class="p-8" style="background-color: var(--surface-color, #ffffff);">
  <h2 class="text-3xl font-bold mb-6 text-center" style="color: var(--text-color, #1f2937);">Contact Form</h2>
  <form class="max-w-lg mx-auto grid gap-4">
    <input type="text" placeholder="이름" class="border p-2 rounded w-full" style="border-color: var(--border-color, #e5e7eb); background-color: var(--surface-color, #ffffff); color: var(--text-color, #1f2937);">
    <input type="email" placeholder="이메일" class="border p-2 rounded w-full" style="border-color: var(--border-color, #e5e7eb); background-color: var(--surface-color, #ffffff); color: var(--text-color, #1f2937);">
    <textarea placeholder="문의 내용" class="border p-2 rounded w-full h-32" style="border-color: var(--border-color, #e5e7eb); background-color: var(--surface-color, #ffffff); color: var(--text-color, #1f2937);"></textarea>
    <button class="p-3 rounded font-bold transition-colors" style="color: var(--text-color, #ffffff); background-color: var(--primary-color, #3b82f6);" onmouseover="this.style.backgroundColor='var(--primary-hover, #2563eb)'" onmouseout="this.style.backgroundColor='var(--primary-color, #3b82f6)'">제출</button>
  </form>
</section>
