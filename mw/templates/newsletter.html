<section class="p-8 text-center" style="background-color: var(--background-color, #f9fafb);">
  <h2 class="text-3xl font-bold mb-4" style="color: var(--text-color, #1f2937);">Subscribe to Our Newsletter</h2>
  <p class="mb-6" style="color: var(--text-secondary, #6b7280);">최신 소식과 업데이트를 받아보세요.</p>
  <form class="max-w-md mx-auto flex gap-2">
    <input type="email" placeholder="이메일 입력" class="flex-1 border p-2 rounded" style="border-color: var(--border-color, #e5e7eb); background-color: var(--surface-color, #ffffff); color: var(--text-color, #1f2937);">
    <button class="px-4 py-2 rounded transition-colors" style="color: var(--text-color, #ffffff); background-color: var(--primary-color, #3b82f6);" onmouseover="this.style.backgroundColor='var(--primary-hover, #2563eb)'" onmouseout="this.style.backgroundColor='var(--primary-color, #3b82f6)'">구독</button>
  </form>
</section>
