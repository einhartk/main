<section class="p-12 text-center" style="background-color: var(--background-color, #f9fafb);">
  <h2 class="text-3xl font-bold mb-10" style="color: var(--text-color, #1f2937);">Our Stats</h2>
  <div class="grid grid-cols-4 gap-6 max-w-4xl mx-auto">
    <div v-for="i in 4" :key="i">
      <p class="text-4xl font-extrabold" style="color: var(--primary-color, #3b82f6);">{{i*25}}</p>
      <p style="color: var(--text-secondary, #6b7280);">항목 {{i}}</p>
    </div>
  </div>
</section>
