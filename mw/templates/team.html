<section class="p-8" style="background-color: var(--surface-color, #ffffff);">

  <div class="grid grid-cols-4 gap-6">
    <div v-for="i in 4" :key="i" class="text-center p-4 rounded shadow" style="background-color: var(--background-color, #f9fafb);">
      <div class="h-32 w-32 rounded-full mx-auto mb-4" style="background-color: var(--border-color, #e5e7eb);"></div>
      <h3 class="font-bold mb-1" style="color: var(--text-color, #1f2937);">Member {{i}}</h3>
      <p class="text-sm" style="color: var(--text-secondary, #6b7280);">직책 / 역할</p>
    </div>
