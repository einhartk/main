<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Game Project</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0b0f17; }
      #app { width: 100%; height: 100%; display: grid; place-items: center; }
      canvas { border: 1px solid rgba(255,255,255,0.12); }

      #auth-ui {
        position: fixed;
        top: 12px;
        right: 12px;
        display: grid;
        gap: 8px;
        padding: 10px 12px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(15, 20, 32, 0.92);
        color: #d7e3ff;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        font-size: 13px;
      }

      #auth-ui button {
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.14);
        background: #16213a;
        color: #d7e3ff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="auth-ui">
      <div id="auth-status">Auth: (loading)</div>
      <button id="btn-login">Login (Google)</button>
      <button id="btn-logout" disabled>Logout</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
