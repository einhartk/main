<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>로스트아크 공격대 편성</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link href="css/style.css?ver=0.2" rel="stylesheet">

</head>

<body>
<div class="container-fluid my-2">
  <!-- 상단 원정대 (8개) -->
  <div class="row mb-4 expedition-row">
    <div class="col-12">
      <h5 class="mb-2">원정대</h5>
      <div id="expedition" class="expedition-grid"></div>
    </div>
  </div>
  
  <!-- 하단 공격대 -->
  <div class="row raid-row">
    <div class="col-12">
      <h5 class="mb-2">공격대 편성</h5>

      <!-- ================= 공격대 ================= -->
      <div class="row g-4 mb-4">
        <div class="col-12">
          <div class="card shadow-sm mb-3 raid-settings">
            <div class="card-header">
              <h5 class="mb-0">공격대 설정</h5>
            </div>
            <div class="card-body">
              <div class="row g-2">
                <div class="col-auto">
                  <button class="btn btn-success btn-sm" onclick="addRaidParty()">
                    <i class="bi bi-plus-lg"></i> 공격대 추가
                  </button>
                </div>
                <div class="col-auto">
                  <button class="btn btn-primary btn-sm" onclick="autoAssign()">
                    <i class="bi bi-magic"></i> 공대 자동 추천
                  </button>
                </div>
                <div class="col-auto">
                  <button class="btn btn-info btn-sm" onclick="balancedAssign()">
                    <i class="bi bi-balance-scale"></i> 균등 분배
                  </button>
                </div>
                <div class="col-auto">
                  <button class="btn btn-info btn-sm" onclick="showRaidListModal()">
                    <i class="bi bi-list-ul"></i> 공대 리스트
                  </button>
                </div>
                <div class="col-auto">
                  <button class="btn btn-warning btn-sm" onclick="saveRaidData()">
                    <i class="bi bi-save"></i> 저장
                  </button>
                </div>
                <div class="col-auto">
                  <button class="btn btn-secondary btn-sm" onclick="loadRaidData()">
                    <i class="bi bi-folder-open"></i> 불러오기
                  </button>
                </div>
                <div class="col-auto">
                  <button class="btn btn-success btn-sm" onclick="shareRaidData()">
                    <i class="bi bi-share"></i> 공유
                  </button>
                </div>
                <div class="col-auto">
                  <button class="btn btn-primary btn-sm" onclick="downloadRaidData()">
                    <i class="bi bi-download"></i> 내려받기
                  </button>
                </div>
                <div class="col-auto">
                  <button class="btn btn-danger btn-sm" onclick="clearAllRaids()">
                    <i class="bi bi-trash"></i> 전체 초기화
                  </button>
                </div>
              </div>
            </div>
          </div>
          
          <div id="raidTabs" class="mb-4">
            <!-- 레이드 탭들이 여기에 동적으로 추가됩니다 -->
          </div>
          
          <div id="raidParties" class="raid-parties-container">
            <!-- 공격대 파티들이 여기에 동적으로 추가됩니다 -->
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 공유 모달창 -->
<div class="modal fade" id="shareRaidModal" tabindex="-1" aria-labelledby="shareRaidModalLabel" aria-hidden="true" style="z-index: 1040;">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="shareRaidModalLabel">공대 데이터 공유</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="shareId" class="form-label">공유 ID (암호)</label>
          <input type="text" class="form-control" id="shareId" placeholder="공유할 ID를 입력하세요 (예: ABC123)" maxlength="10">
          <div class="form-text">영문+숫자 조합으로 최대 10자</div>
        </div>
        <div class="alert alert-info">
          <i class="bi bi-info-circle"></i> 입력한 ID로 공대 데이터가 저장됩니다. 다른 사람이 이 ID로 내려받을 수 있습니다.
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
        <button type="button" class="btn btn-success" onclick="confirmShareRaid()">공유하기</button>
      </div>
    </div>
  </div>
</div>

<!-- 내려받기 모달창 -->
<div class="modal fade" id="downloadRaidModal" tabindex="-1" aria-labelledby="downloadRaidModalLabel" aria-hidden="true" style="z-index: 1030;">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="downloadRaidModalLabel">공대 데이터 내려받기</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="downloadId" class="form-label">공유 ID</label>
          <input type="text" class="form-control" id="downloadId" placeholder="내려받을 ID를 입력하세요" maxlength="10">
          <div class="form-text">다른 사람이 공유한 ID를 입력하세요</div>
        </div>
        <div class="alert alert-warning">
          <i class="bi bi-exclamation-triangle"></i> 내려받기 시 현재 공대 데이터는 덮어쓰기 됩니다.
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
        <button type="button" class="btn btn-primary" onclick="confirmDownloadRaid()">내려받기</button>
      </div>
    </div>
  </div>
</div>

<!-- 프로그레스 모달 -->
<div class="modal fade" id="progressModal" tabindex="-1" aria-labelledby="progressModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false" style="z-index: 1090;">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-body text-center py-4">
        <div class="spinner-border text-primary mb-3" role="status" style="width: 3rem; height: 3rem;">
          <span class="visually-hidden">Loading...</span>
        </div>
        <h5 class="modal-title" id="progressTitle">처리 중...</h5>
        <p class="text-muted mb-0" id="progressMessage">잠시만 기다려주세요.</p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

<!-- 애플리케이션 스크립트 -->
<script src="js/modal-manager.js?ver=0.1"></script>
<script src="js/firebase-config.js?ver=0.1"></script>
<script src="js/api-config.js?ver=0.1"></script>
<script src="js/main.js?ver=0.3"></script>
<script src="js/announcement.js?ver=0.1"></script>
<script src="js/chat.js?ver=0.1" defer></script>

<script>

</script>
</body>
</html>
