<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>로스트아크 공격대 편성</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link href="css/style.css?ver=0.1" rel="stylesheet">

</head>

<body>
<div class="container-fluid my-2">
  <!-- 상단 원정대 (8개) -->
  <div class="row mb-4">
    <div class="col-12">
      <h5 class="mb-2">원정대</h5>
      <div id="expedition" class="expedition-grid"></div>
    </div>
  </div>
  
  <!-- 하단 공격대 -->
  <div class="row">
    <div class="col-12">
      <h5 class="mb-2">공격대 편성</h5>

      <!-- ================= 공격대 ================= -->
      <div class="row g-4 mb-4">
        <div class="col-12">
          <div class="card shadow-sm mb-3 raid-settings">
            <div class="card-header">
              <h5 class="mb-0">공격대 설정</h5>
            </div>
            <div class="card-body">
              <div class="row g-2">
                <div class="col-auto">
                  <button class="btn btn-success btn-sm" onclick="addRaidParty()">
                    <i class="bi bi-plus-lg"></i> 공격대 추가
                  </button>
                </div>
                <div class="col-auto">
                  <button class="btn btn-primary btn-sm" onclick="autoAssign()">
                    <i class="bi bi-magic"></i> 공대 자동 추천
                  </button>
                </div>
                <div class="col-auto">
                  <button class="btn btn-info btn-sm" onclick="balancedAssign()">
                    <i class="bi bi-balance-scale"></i> 균등 분배
                  </button>
                </div>
                <div class="col-auto">
                  <button class="btn btn-info btn-sm" onclick="showRaidListModal()">
                    <i class="bi bi-list-ul"></i> 공대 리스트
                  </button>
                </div>
                <div class="col-auto">
                  <button class="btn btn-warning btn-sm" onclick="saveRaidData()">
                    <i class="bi bi-save"></i> 저장
                  </button>
                </div>
                <div class="col-auto">
                  <button class="btn btn-secondary btn-sm" onclick="loadRaidData()">
                    <i class="bi bi-folder-open"></i> 불러오기
                  </button>
                </div>
                <div class="col-auto">
                  <button class="btn btn-danger btn-sm" onclick="clearAllRaids()">
                    <i class="bi bi-trash"></i> 전체 초기화
                  </button>
                </div>
              </div>
            </div>
          </div>
          
          <div id="raidParties" class="raid-parties-container">
            <!-- 공격대 파티들이 여기에 동적으로 추가됩니다 -->
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api-config.js"></script>
<script src="js/main.js?ver=0.1"></script>
<script src="js/announcement.js"></script>

<script>

</script>
</body>
</html>
