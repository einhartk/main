<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정보처리기사 CBT</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    font-family:맑은 고딕, system-ui, -apple-system, sans-serif;
    background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height:100vh;
    padding:20px 0;
}

.container{
    max-width:900px;
}

.question{
    background:white;
    margin-bottom:20px;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 6px rgba(0,0,0,0.1);
    border:none;
}

.correct{
    color:#198754;
    font-weight:bold;
}

.wrong{
    color:#dc3545;
    font-weight:bold;
}

.hint-box{
    background:#fff3cd;
    border:1px solid #ffc107;
    border-radius:8px;
    padding:15px;
    margin-top:15px;
    display:none;
}

.hint-box.show{
    display:block;
    animation:fadeIn 0.3s ease-in;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(-10px);}
    to{opacity:1; transform:translateY(0);}
}

.btn-hint{
    background:#ffc107;
    border:none;
    color:#000;
    padding:8px 16px;
    border-radius:8px;
    font-size:14px;
    margin-top:10px;
}

.btn-hint:hover{
    background:#ffca2c;
}

label{
    display:block;
    margin:10px 0;
    cursor:pointer;
    padding:12px 15px;
    border-radius:8px;
    transition:all 0.2s;
    border:2px solid #e9ecef;
}

label:hover{
    background:#f8f9fa;
    border-color:#dee2e6;
}

input[type="radio"]:checked + span{
    color:#0d6efd;
    font-weight:600;
}

input[type="radio"]{
    margin-right:10px;
    cursor:pointer;
    transform:scale(1.1);
}

.code-block{
    background:#f8f9fa;
    border:1px solid #dee2e6;
    border-radius:8px;
    padding:15px;
    margin:10px 0;
    font-family:'Courier New', monospace;
    font-size:14px;
    line-height:1.6;
    overflow-x:auto;
    white-space:pre-wrap;
    word-wrap:break-word;
}

.code-block-title{
    background:#e9ecef;
    padding:8px 15px;
    border-radius:8px 8px 0 0;
    font-weight:600;
    font-size:13px;
    color:#495057;
    margin:-15px -15px 15px -15px;
}

@media (max-width: 768px) {
    .question{
        padding:20px;
        border-radius:12px;
    }

    label{
        font-size:15px;
        padding:10px 12px;
    }

    h1{
        font-size:24px;
    }

    h3{
        font-size:18px;
    }
}
</style>
</head>

<body>

<div class="container py-4">

<div class="text-center mb-4">
<h1 class="text-white fw-bold">정보처리기사 실기 CBT</h1>
<p class="text-white-50">문제를 풀고 채점해보세요</p>
</div>

<div id="questionArea" class="mb-4"></div>

<div class="text-center mb-3">
<div class="btn-group" role="group" id="fileNav">
    <button type="button" class="btn btn-outline-light active" onclick="selectFile('file1')">1번 파일</button>
    <button type="button" class="btn btn-outline-light" onclick="selectFile('file2')">2번 파일</button>
    <button type="button" class="btn btn-outline-light" onclick="selectFile('file3')">3번 파일</button>
    <button type="button" class="btn btn-outline-light" onclick="selectFile('mixed')">혼합</button>
</div>
</div>

<div class="text-center mb-4">
<div class="btn-group" role="group" id="categoryNav">
    <button type="button" class="btn btn-outline-light active" onclick="selectCategory('all')">전체</button>
    <button type="button" class="btn btn-outline-light" onclick="selectCategory('java')">Java</button>
    <button type="button" class="btn btn-outline-light" onclick="selectCategory('c')">C</button>
    <button type="button" class="btn btn-outline-light" onclick="selectCategory('python')">Python</button>
    <button type="button" class="btn btn-outline-light" onclick="selectCategory('sql')">SQL</button>
    <button type="button" class="btn btn-outline-light" onclick="selectCategory('db')">DB</button>
    <button type="button" class="btn btn-outline-light" onclick="selectCategory('os')">OS</button>
    <button type="button" class="btn btn-outline-light" onclick="selectCategory('network')">Network</button>
    <button type="button" class="btn btn-outline-light" onclick="selectCategory('security')">Security</button>
    <button type="button" class="btn btn-outline-light" onclick="selectCategory('sw')">SW</button>
</div>
</div>

<div class="text-center mb-4">
<div class="btn-group" role="group" id="modeNav">
    <button type="button" class="btn btn-outline-light active" onclick="selectMode('all')">전체</button>
    <button type="button" class="btn btn-outline-light" onclick="selectMode('random1')">1문제 랜덤</button>
</div>
</div>

<div class="text-center">
<button onclick="gradeExam()" class="btn btn-primary btn-lg px-5">채점하기</button>
</div>

<div id="score" class="mt-4 text-center"></div>

</div>

<script src="questions.js"></script>
<script src="questions2.js"></script>
<script src="questions3.js"></script>

<script>

const area=document.getElementById("questionArea");

// 현재 선택된 파일 모드
let currentFileMode = 'file1';
// 현재 선택된 카테고리
let currentCategory = 'all';
// 현재 선택된 모드
let currentMode = 'all';
// 1문제 랜덤 모드용 변수
let shuffledQuestions = [];
let currentQuestionIndex = 0;

// 파일별 문제 가져오기
function getQuestionsByMode(mode){
    if(mode === 'file1'){
        return questions;
    } else if(mode === 'file2'){
        return questions2;
    } else if(mode === 'file3'){
        return questions3;
    } else {
        // 혼합 모드: 세 파일 섞어서 100문항만 랜덤 선택
        const combined = [...questions, ...questions2, ...questions3];
        const shuffled = combined.sort(() => Math.random() - 0.5);
        return shuffled.slice(0, 100);
    }
}

// 카테고리 필터링
function filterByCategory(questionsList, category){
    if(category === 'all'){
        return questionsList;
    }
    // category 필드가 없는 문제는 필터링에서 제외하지 않음
    return questionsList.filter(q => !q.category || q.category === category);
}

// 모드 적용
function applyMode(questionsList, mode){
    if(mode === 'random1'){
        shuffledQuestions = questionsList.sort(() => Math.random() - 0.5);
        currentQuestionIndex = 0;
        return [shuffledQuestions[0]];
    }
    shuffledQuestions = [];
    currentQuestionIndex = 0;
    return questionsList;
}

// 최종 문제 가져오기
function getFilteredQuestions(){
    let questionsList = getQuestionsByMode(currentFileMode);
    questionsList = filterByCategory(questionsList, currentCategory);
    questionsList = applyMode(questionsList, currentMode);
    return questionsList;
}

// 다음 문제로 이동 (1문제 랜덤 모드용)
function nextQuestion(){
    if(currentMode === 'random1' && currentQuestionIndex < shuffledQuestions.length - 1){
        currentQuestionIndex++;
        renderSingleQuestion(shuffledQuestions[currentQuestionIndex], currentQuestionIndex);
    }
}

// 단일 문제 렌더링 (1문제 랜덤 모드용)
function renderSingleQuestion(q, index){
    area.innerHTML = '';
    
    // 코드 블록 처리 함수
    function formatCodeBlock(text){
        return text.replace(/```([\s\S]*?)```/g, function(match, code){
            return `<div class="code-block"><div class="code-block-title">코드</div>${code.trim()}</div>`;
        }).replace(/`([^`]+)`/g, function(match, code){
            return `<code style="background:#e9ecef; padding:2px 6px; border-radius:4px; font-family:'Courier New', monospace;">${code}</code>`;
        });
    }
    
    let formattedQuestion = formatCodeBlock(q.question);
    
    let html=`
    <div class="question card">
    <div class="card-body">
    <h3 class="card-title h5 mb-3">${index + 1}. ${formattedQuestion}</h3>
    `;
    
    q.options.forEach((op,i)=>{
        html+=`
        <label class="form-check-label">
        <input type="radio" class="form-check-input me-2" name="q0" value="${i}">
        <span>${op}</span>
        </label>
        `;
    });
    
    html+=`
    <button type="button" class="btn btn-hint" onclick="toggleHint(0)">💡 힌트 보기</button>
    <div id="hint0" class="hint-box">
    <strong>힌트:</strong> ${q.hint || '힌트가 없습니다.'}
    </div>
    <div id="result0" class="mt-3"></div>
    </div>
    </div>
    `;
    
    // 다음 문제 버튼 (1문제 랜덤 모드일 때만)
    if(currentMode === 'random1' && currentQuestionIndex < shuffledQuestions.length - 1){
        html+=`
        <div class="text-center mt-3">
        <button onclick="nextQuestion()" class="btn btn-primary">다음 문제</button>
        </div>
        `;
    }
    
    area.innerHTML = html;
}

// 파일 선택
function selectFile(mode){
    currentFileMode = mode;
    
    // 버튼 활성 상태 업데이트
    const buttons = document.querySelectorAll('#fileNav button');
    buttons.forEach(btn => btn.classList.remove('active'));
    
    if(mode === 'file1'){
        buttons[0].classList.add('active');
    } else if(mode === 'file2'){
        buttons[1].classList.add('active');
    } else if(mode === 'file3'){
        buttons[2].classList.add('active');
    } else {
        buttons[3].classList.add('active');
    }
    
    renderQuestions();
}

// 카테고리 선택
function selectCategory(category){
    currentCategory = category;
    
    // 버튼 활성 상태 업데이트
    const buttons = document.querySelectorAll('#categoryNav button');
    buttons.forEach(btn => btn.classList.remove('active'));
    
    const categoryMap = {
        'all': 0,
        'java': 1,
        'c': 2,
        'python': 3,
        'sql': 4,
        'db': 5,
        'os': 6,
        'network': 7,
        'security': 8,
        'sw': 9
    };
    
    buttons[categoryMap[category]].classList.add('active');
    renderQuestions();
}

// 모드 선택
function selectMode(mode){
    currentMode = mode;
    
    // 버튼 활성 상태 업데이트
    const buttons = document.querySelectorAll('#modeNav button');
    buttons.forEach(btn => btn.classList.remove('active'));
    
    if(mode === 'all'){
        buttons[0].classList.add('active');
    } else {
        buttons[1].classList.add('active');
    }
    
    renderQuestions();
}

// 문제 렌더링
function renderQuestions(){
    const currentQuestions = getFilteredQuestions();
    area.innerHTML = '';
    
    // 1문제 랜덤 모드일 때는 단일 문제 렌더링
    if(currentMode === 'random1' && currentQuestions.length > 0){
        renderSingleQuestion(currentQuestions[0], currentQuestionIndex);
        return;
    }
    
    currentQuestions.forEach((q, index)=>{
    
    // 코드 블록 처리 함수
    function formatCodeBlock(text){
        // 백틱으로 감싸진 코드 부분을 찾아서 코드 블록으로 변환
        return text.replace(/```([\s\S]*?)```/g, function(match, code){
            return `<div class="code-block"><div class="code-block-title">코드</div>${code.trim()}</div>`;
        }).replace(/`([^`]+)`/g, function(match, code){
            // 단일 백틱은 인라인 코드로 처리
            return `<code style="background:#e9ecef; padding:2px 6px; border-radius:4px; font-family:'Courier New', monospace;">${code}</code>`;
        });
    }
    
    let formattedQuestion = formatCodeBlock(q.question);
    
    let html=`
    <div class="question card">
    
    <div class="card-body">
    <h3 class="card-title h5 mb-3">${index+1}. ${formattedQuestion}</h3>
    `;

q.options.forEach((op,i)=>{

html+=`
<label class="form-check-label">
<input
type="radio"
class="form-check-input me-2"
name="q${index}"
value="${i}">
<span>${op}</span>
</label>
`;

});

html+=`
<button type="button" class="btn btn-hint" onclick="toggleHint(${index})">💡 힌트 보기</button>
<div id="hint${index}" class="hint-box">
<strong>힌트:</strong> ${q.hint || '힌트가 없습니다.'}
</div>
<div id="result${index}" class="mt-3"></div>
</div>
</div>
`;

area.innerHTML+=html;

});
}

function toggleHint(index){
const hintBox=document.getElementById(`hint${index}`);
hintBox.classList.toggle('show');
const btn=event.target;
if(hintBox.classList.contains('show')){
btn.textContent='🔽 힌트 숨기';
}else{
btn.textContent='💡 힌트 보기';
}
}

function gradeExam(){

let score=0;
const currentQuestions = getFilteredQuestions();

currentQuestions.forEach((q,index)=>{

const selected=
document.querySelector(
`input[name="q${index}"]:checked`
);

const result=
document.getElementById(
`result${index}`
);

if(!selected){

result.innerHTML=
`<div class="alert alert-warning">미응답</div>`;

return;
}

if(Number(selected.value)
=== q.answer){

score++;

result.innerHTML=
`
<div class="alert alert-success">
<strong>✅ 정답!</strong>
</div>

<div class="alert alert-light">
<strong>해설:</strong><br>
${q.explanation}
</div>
`;
}
else{

result.innerHTML=
`
<div class="alert alert-danger">
<strong>❌ 오답</strong>
</div>

<div class="alert alert-info">
<strong>정답:</strong> ${q.options[q.answer]}
</div>

<div class="alert alert-light">
<strong>해설:</strong><br>
${q.explanation}
</div>
`;
}

});

document.getElementById("score")
.innerHTML=
`
<div class="card bg-white shadow">
<div class="card-body text-center">
<h3 class="card-title">총점: ${score} / ${currentQuestions.length}</h3>
<p class="card-text text-muted">정답률: ${Math.round((score/currentQuestions.length)*100)}%</p>
</div>
</div>
`;

// 1문제 랜덤 모드일 때 다음 문제 버튼 추가
if(currentMode === 'random1' && currentQuestionIndex < shuffledQuestions.length - 1){
    document.getElementById("score").innerHTML+=`
    <div class="text-center mt-3">
    <button onclick="nextQuestion()" class="btn btn-primary">다음 문제</button>
    </div>
    `;
}
}

// 초기화
renderQuestions();

</script>

</body>
</html>
